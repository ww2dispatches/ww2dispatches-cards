<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Oswald";font-weight:500;src:url(fonts/oswald-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Oswald";font-weight:700;src:url(fonts/oswald-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Special Elite";font-weight:400;src:url(fonts/special-elite-latin-400-normal.woff2) format("woff2")}
body{margin:0}
</style></head>
<body>
<script>
/* Campaign Series post (decided 11 Nov 2026, look C "Teletype tape" from the Campaign Series Bulletin Mockup).
   Not a card: no dispatch number, no series stamp, never in Declass.
   The archival photo fills the frame in grayscale. A cream tab at top left reads CAMPAIGN SERIES over the
   series name and DAY N (day in teletype red). A cream strip near the bottom carries the one line subtitle,
   then BULLETIN · date · place on the left and @ww2dispatches on the right.
   Units are the mockup's pixels at 1080 x 1350 (s = 1). The X image (1600 x 1440) scales by area and lifts the
   strip clear of X's ALT badge in the bottom left corner. */
const PAPER="#EFE6D2", INK="#1F2A44", RED="#B04A3E";
const MON=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
function shortDate(v){const [y,m,d]=v.split("-").map(Number); return `${d} ${MON[m-1]} ${y}`;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let grain=null;
function makeGrain(){const c=document.createElement("canvas");c.width=c.height=256;const g=c.getContext("2d");
  const d=g.createImageData(256,256),r=rng(7);
  for(let i=0;i<d.data.length;i+=4){d.data[i]=92;d.data[i+1]=71;d.data[i+2]=43;d.data[i+3]=Math.floor(r()*r()*55);}
  g.putImageData(d,0,0);return c;}
function paper(ctx,x,y,w,h,s){
  ctx.save(); ctx.shadowColor="rgba(0,0,0,.5)"; ctx.shadowBlur=16*s; ctx.shadowOffsetY=4*s;
  ctx.fillStyle=PAPER; ctx.fillRect(x,y,w,h); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  ctx.fillStyle=ctx.createPattern(grain,"repeat"); ctx.fillRect(x,y,w,h); ctx.restore();
}
function draw(cv,img,p){
  const W=cv.width,H=cv.height,ctx=cv.getContext("2d"),wide=W>H;
  const s=Math.sqrt(W*H/(1080*1350));
  const warn=[];
  ctx.fillStyle="#1b1b1b"; ctx.fillRect(0,0,W,H);
  const iw=img.naturalWidth, ih=img.naturalHeight, z=(p.zoom||100)/100, k=Math.max(W/iw,H/ih)*z;
  const dw=iw*k, dh=ih*k, fx=p.focusX!=null?p.focusX:50, fy=p.focusY!=null?p.focusY:40;
  ctx.save(); ctx.filter="grayscale(1)"; ctx.drawImage(img,-(dw-W)*(fx/100),-(dh-H)*(fy/100),dw,dh); ctx.restore();
  ctx.textBaseline="alphabetic"; ctx.textAlign="left";
  /* top tab */
  const name=(p.seriesName||"").toUpperCase(), day="DAY "+p.day;
  ctx.font=`700 ${44*s}px Oswald`; ctx.letterSpacing=`${2*s}px`;
  const nameW=ctx.measureText(name).width, dayW=ctx.measureText(day).width;
  ctx.font=`500 ${20*s}px Oswald`; ctx.letterSpacing=`${5*s}px`;
  const capW=ctx.measureText("CAMPAIGN SERIES").width;
  const tabW=Math.max(capW,nameW+18*s+dayW)+48*s, tabH=(16+20+6+44+16)*s+4*s;
  const tx=40*s, ty=44*s;
  paper(ctx,tx,ty,tabW,tabH,s);
  ctx.fillStyle=INK; ctx.fillText("CAMPAIGN SERIES",tx+24*s,ty+(14+18)*s);
  ctx.font=`700 ${44*s}px Oswald`; ctx.letterSpacing=`${2*s}px`;
  const by=ty+(14+20+6+40)*s;
  ctx.fillText(name,tx+24*s,by);
  ctx.fillStyle=RED; ctx.fillText(day,tx+24*s+nameW+18*s,by);
  /* bottom strip */
  const lift=(wide?110:60)*s;
  const padX=40*s, innerW=W-2*padX;
  let fs=50*s; ctx.letterSpacing="0px";
  const sub=(p.subtitle||"").trim();
  for(;fs>40*s;fs-=1*s){ctx.font=`700 ${fs}px Oswald`; if(ctx.measureText(sub).width<=innerW) break;}
  ctx.font=`700 ${fs}px Oswald`;
  if(ctx.measureText(sub).width>innerW) warn.push("subtitle too long: "+sub);
  const stripH=(24+fs/s*1.05+12+26+22)*s;
  const sy=H-lift-stripH;
  paper(ctx,0,sy,W,stripH,s);
  ctx.fillStyle=INK; ctx.fillText(sub,padX,sy+24*s+fs*.86);
  const ly=sy+stripH-22*s-4*s;
  ctx.font=`400 ${26*s}px "Special Elite"`; ctx.letterSpacing="0px";
  const bl=`BULLETIN · ${shortDate(p.date)} · ${(p.place||"").toUpperCase()}`;
  ctx.fillText(bl,padX,ly);
  ctx.font=`400 ${22*s}px "Special Elite"`; ctx.textAlign="right";
  ctx.fillText("@ww2dispatches",W-padX,ly);
  ctx.textAlign="left";
  ctx.font=`400 ${26*s}px "Special Elite"`; const blW=ctx.measureText(bl).width;
  ctx.font=`400 ${22*s}px "Special Elite"`; const hW=ctx.measureText("@ww2dispatches").width;
  if(blW+hW+30*s>innerW) warn.push("bulletin line runs into the handle: "+bl);
  return warn;
}
window.renderCampaign=async function(p,photoDataUrl){
  await Promise.all(["700 10px Oswald","500 10px Oswald",'400 10px "Special Elite"'].map(f=>document.fonts.load(f)));
  if(!grain) grain=makeGrain();
  const img=await new Promise((ok,bad)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=bad;i.src=photoDataUrl;});
  const out={warn:[]};
  for(const [kind,w,h] of [["x",1600,1440],["instagram",1080,1350]]){
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;
    out.warn.push(...draw(cv,img,p).map(m=>kind+": "+m)); out[kind]=cv.toDataURL("image/jpeg",.92);
  }
  return out;
};
</script>
</body></html>
