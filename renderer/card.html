<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Oswald";font-weight:500;src:url(fonts/oswald-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Oswald";font-weight:600;src:url(fonts/oswald-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Oswald";font-weight:700;src:url(fonts/oswald-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Special Elite";font-weight:400;src:url(fonts/special-elite-latin-400-normal.woff2) format("woff2")}
body{margin:0}
</style></head>
<body>
<script>
/* Server side copy of the Dispatch Press draw() routine. Keep in step with the artifact
   so cards rendered here match cards saved by hand. */
const SERIES = {battle:["Battle Lines","#B04A3E"],home:["Home Front","#5E6B3A"],blue:["Blueprint","#3D5884"],state:["Statecraft","#B8862B"]};
const SKEY={battle:"battle",home:"home",blue:"blue",blueprint:"blue",state:"state",statecraft:"state","battle lines":"battle","home front":"home"};
const PAPER="#EDE4CF", INK="#1A1612", NAVY="#3D5884";
const MON=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
let grainTile=null;

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeGrain(){
  const c=document.createElement("canvas"); c.width=c.height=256; const g=c.getContext("2d");
  const d=g.createImageData(256,256), r=rng(7);
  for(let i=0;i<d.data.length;i+=4){d.data[i]=92;d.data[i+1]=71;d.data[i+2]=43;d.data[i+3]=Math.floor(r()*r()*70);}
  g.putImageData(d,0,0); return c;
}
function wrap(ctx,text,maxW,maxLines){
  const words=text.split(/\s+/).filter(Boolean), lines=[]; let cur="";
  for(const w of words){const t=cur?cur+" "+w:w; if(ctx.measureText(t).width<=maxW||!cur){cur=t}else{lines.push(cur);cur=w}}
  if(cur) lines.push(cur);
  return lines.slice(0,maxLines);
}
function pad(n){return "No. "+String(Math.max(1,parseInt(n)||1)).padStart(3,"0");}
function shortDate(v){const [y,m,d]=v.split("-").map(Number); return `${d} ${MON[m-1]} ${y}`;}

/* Evening formats (5 p.m. slot). The 8 a.m. story dispatch has no format label. */
const FORMATS={photo:"Photo of the Day",quote:"Quote of the Day",spec:"Spec Sheet",footage:"The Footage"};
/* "footage" is set by renderOverlays for Living Cards (label chosen by Brian 19 Oct 2026; Story Cards say "The Story"). */
const NAME_THIS_VIOLET="#5B4B8A"; /* Name This stamp, seal and clue: Mimeograph Violet */

function fitLines(ctx,text,font,maxW,maxH,lineK,startPx,minPx){
  for(let s=startPx;s>=minPx;s-=Math.max(1,startPx*.03)){
    ctx.font=font(s); const lines=wrap(ctx,text,maxW,99);
    if(lines.length*s*lineK<=maxH) return {size:s,lines};
  }
  ctx.font=font(minPx); return {size:minPx,lines:wrap(ctx,text,maxW,99)};
}

/* Quote of the Day: the photo dimmed, the quote set large in typewriter type, the speaker under it. */
function drawQuote(ctx,u,px,py,pw,ph,p,accent){
  const g=ctx.createLinearGradient(0,py,0,py+ph);
  g.addColorStop(0,"rgba(26,22,18,.58)"); g.addColorStop(1,"rgba(26,22,18,.78)");
  ctx.fillStyle=g; ctx.fillRect(px,py,pw,ph);
  const padX=pw*.09, maxW=pw-2*padX, byH=8*u, top=py+ph*.12, avail=ph*.76-byH;
  const q=(p.quote||"").trim();
  const f=s=>`400 ${s}px "Special Elite"`;
  ctx.letterSpacing="0px";
  const {size,lines}=fitLines(ctx,"“"+q+"”",f,maxW,avail,1.28,7*u,3.4*u);
  ctx.font=f(size); ctx.fillStyle=PAPER; ctx.textAlign="left"; ctx.textBaseline="alphabetic";
  const blockH=lines.length*size*1.28, y0=top+(avail-blockH)/2+size;
  lines.forEach((ln,i)=>ctx.fillText(ln,px+padX,y0+i*size*1.28));
  const by=(p.quoteBy||"").trim();
  if(by){
    const yb=y0+(lines.length-1)*size*1.28+size*.9+3.2*u;
    ctx.fillStyle=accent; ctx.fillRect(px+padX,yb-2.6*u,6*u,.45*u);
    ctx.fillStyle=PAPER; ctx.font=`600 ${2.8*u}px Oswald`; ctx.letterSpacing=`${.08*2.8*u}px`;
    wrap(ctx,by.toUpperCase(),maxW,2).forEach((ln,i)=>ctx.fillText(ln,px+padX,yb+1.6*u+i*3.6*u));
  }
}

/* Spec Sheet: a datasheet panel under the photo. p.specTitle, p.specs = [[label, value], ...] (up to 6). */
function drawSpecPanel(ctx,u,x,y,w,h,p,accent,wide){
  ctx.fillStyle="rgba(120,88,48,.07)"; ctx.fillRect(x,y,w,h);
  ctx.strokeStyle=INK; ctx.lineWidth=.35*u; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+w,y); ctx.stroke();
  const padX=3*u, title=(p.specTitle||"").toUpperCase();
  ctx.textAlign="left"; ctx.textBaseline="alphabetic";
  ctx.fillStyle=INK; ctx.font=`700 ${(wide?3.6:4.2)*u}px Oswald`; ctx.letterSpacing=`${.03*4*u}px`;
  const ty=y+(wide?5.4:6.2)*u; ctx.fillText(title,x+padX,ty);
  ctx.fillStyle=accent; ctx.fillRect(x+padX,ty+1.4*u,10*u,.5*u);
  const rows=(p.specs||[]).slice(0,6), cols=wide&&rows.length>3?2:1, per=Math.ceil(rows.length/cols);
  const top=ty+3.6*u, avail=y+h-top-1.6*u, rowH=Math.min(avail/Math.max(per,1),(wide?5.2:6.4)*u);
  const colW=(w-2*padX-(cols-1)*4*u)/cols;
  rows.forEach(([label,val],i)=>{
    const c=Math.floor(i/per), r=i%per, cx=x+padX+c*(colW+4*u), base=top+r*rowH+rowH*.68;
    ctx.fillStyle=NAVY; ctx.font=`400 ${(wide?2.1:2.5)*u}px "Special Elite"`; ctx.letterSpacing=`${.03*2.4*u}px`;
    ctx.textAlign="left"; ctx.fillText(String(label),cx,base);
    ctx.fillStyle=INK; ctx.font=`600 ${(wide?2.5:3)*u}px Oswald`; ctx.letterSpacing=`${.02*2.8*u}px`;
    ctx.textAlign="right"; ctx.fillText(String(val),cx+colW,base);
    ctx.strokeStyle="rgba(61,88,132,.45)"; ctx.lineWidth=.18*u; ctx.setLineDash([.6*u,.5*u]);
    ctx.beginPath(); ctx.moveTo(cx,top+(r+1)*rowH-.2*u); ctx.lineTo(cx+colW,top+(r+1)*rowH-.2*u); ctx.stroke(); ctx.setLineDash([]);
  });
  ctx.textAlign="left";
}

function draw(cv,img,p){
  const W=cv.width,H=cv.height,ctx=cv.getContext("2d"),u=W/100,m=3.2*u,topH=14.5*u;
  /* Players draw over the bottom of an image or video: X's ALT badge (bottom left of every image with alt text),
     the video timestamp (bottom left), the mute button (bottom right), and the desktop control bar (along the
     bottom). So the X image (1600 x 1440) and the X and 4:5 Living Card videos get 5u of extra paper at the
     bottom of the band, and the date, place, pull line, and handle sit above it. The top band stays as it is
     so the photo stays as large as possible (Brian, 21 Oct 2026). The 4:5 still card is unchanged. */
  const altPad=(W>H||(p.format||"").toLowerCase()==="footage")?5*u:0, botH=14.5*u+altPad;
  const [sName,accent]=SERIES[SKEY[(p.series||"").toLowerCase()]||"battle"];
  ctx.save(); ctx.clearRect(0,0,W,H);
  ctx.fillStyle=PAPER; ctx.fillRect(0,0,W,H);
  if(!grainTile) grainTile=makeGrain();
  ctx.fillStyle=ctx.createPattern(grainTile,"repeat"); ctx.fillRect(0,0,W,H);
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.72);
  vg.addColorStop(0,"rgba(120,88,48,0)"); vg.addColorStop(1,"rgba(120,88,48,.24)"); ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  const px=m,py=topH,pw=W-2*m,ph=H-topH-botH;
  const iw=img?img.naturalWidth:pw, ih=img?img.naturalHeight:ph;
  const z=(p.zoom||100)/100, s=Math.max(pw/iw,ph/ih)*z;
  const dw=iw*s, dh=ih*s;
  const fx=p.focusX!=null?p.focusX:50, fy=p.focusY!=null?p.focusY:40;
  const dx=px-(dw-pw)*(fx/100), dy=py-(dh-ph)*(fy/100);
  const fmt=(p.format||"dispatch").toLowerCase();
  if(img && fmt==="spec"){
    /* Spec Sheet: photo in the upper part of the window, data panel below. */
    const split=W>H*1.1?0.58:0.52, ph2=ph*split;
    const s2=Math.max(pw/iw,ph2/ih)*z, dw2=iw*s2, dh2=ih*s2;
    const dx2=px-(dw2-pw)*(fx/100), dy2=py-(dh2-ph2)*(fy/100);
    ctx.save(); ctx.beginPath(); ctx.rect(px,py,pw,ph2); ctx.clip();
    ctx.filter="sepia(.12) contrast(1.04)"; ctx.drawImage(img,dx2,dy2,dw2,dh2); ctx.filter="none"; ctx.restore();
    drawSpecPanel(ctx,u,px,py+ph2,pw,ph-ph2,p,accent,W>H*1.1);
  } else if(img){
    ctx.save(); ctx.beginPath(); ctx.rect(px,py,pw,ph); ctx.clip();
    ctx.filter="sepia(.12) contrast(1.04)"; ctx.drawImage(img,dx,dy,dw,dh); ctx.filter="none";
    if(fmt==="quote") drawQuote(ctx,u,px,py,pw,ph,p,accent);
    ctx.restore();
  } else { ctx.clearRect(px,py,pw,ph); cv.win=[px,py,pw,ph]; } /* living card: footage shows through */
  ctx.lineWidth=.35*u; ctx.strokeStyle=INK; ctx.strokeRect(px+.175*u,py+.175*u,pw-.35*u,ph-.35*u);

  ctx.textAlign="left"; ctx.textBaseline="alphabetic";
  ctx.fillStyle=INK; ctx.font=`700 ${4.4*u}px Oswald`; ctx.letterSpacing=`${.02*4.4*u}px`;
  ctx.fillText("WW2 DISPATCHES",m,7.7*u);
  ctx.fillStyle=NAVY; ctx.font=`400 ${2.4*u}px "Special Elite"`; ctx.letterSpacing=`${.04*2.4*u}px`;
  ctx.fillText(fmt==="namethis"?(p.subline||"Can you name it?"):("Dispatch "+pad(p.num)+(FORMATS[fmt]?"  ·  "+FORMATS[fmt]:"")),m,11.3*u);

  ctx.font=`600 ${2.9*u}px Oswald`; ctx.letterSpacing=`${.14*2.9*u}px`;
  const NT=fmt==="namethis";
  const label=NT?"NAME THIS":sName.toUpperCase(), tw=ctx.measureText(label).width;
  const stampFill=NT?(p.stampColor||NAME_THIS_VIOLET):accent;
  const sw=tw+4*u, sh=5*u, cx=W-m-sw/2-.4*u, cy=topH/2+.2*u;
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(-2*Math.PI/180);
  ctx.fillStyle=stampFill; ctx.fillRect(-sw/2,-sh/2,sw,sh);
  ctx.strokeStyle=PAPER; ctx.lineWidth=.32*u; ctx.strokeRect(-sw/2+.55*u,-sh/2+.55*u,sw-1.1*u,sh-1.1*u);
  ctx.fillStyle=PAPER; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(label,.07*u,.15*u);
  const r=rng(31); ctx.fillStyle=PAPER;
  for(let i=0;i<Math.floor(sw*sh/(u*u)*5);i++){ctx.globalAlpha=.12+r()*.3; const rr=(.04+r()*r()*.22)*u; ctx.beginPath(); ctx.arc(-sw/2+r()*sw,-sh/2+r()*sh,rr,0,Math.PI*2); ctx.fill();}
  ctx.globalAlpha=1; ctx.restore();

  if(NT){
    /* question seal in the top band, just left of the stamp, never over the photo */
    const R=4.6*u, sx=cx-sw/2-R-2.6*u, sy=cy;
    ctx.save(); ctx.translate(sx,sy); ctx.rotate(-6*Math.PI/180);
    ctx.fillStyle=stampFill; ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=PAPER; ctx.lineWidth=.32*u; ctx.beginPath(); ctx.arc(0,0,R-.75*u,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle=PAPER; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.font=`700 ${5.6*u}px Oswald`; ctx.letterSpacing="0px"; ctx.fillText("?",0,.35*u);
    const r2=rng(17); for(let i=0;i<160;i++){ctx.globalAlpha=.12+r2()*.3; const a=r2()*Math.PI*2, d=r2()*R; ctx.beginPath(); ctx.arc(Math.cos(a)*d,Math.sin(a)*d,(.04+r2()*r2()*.2)*u,0,Math.PI*2); ctx.fill();}
    ctx.globalAlpha=1; ctx.restore();
  }

  const dateBase=H-botH+7.7*u, placeBase=dateBase+3.5*u;
  ctx.textAlign="left"; ctx.textBaseline="alphabetic";
  ctx.fillStyle=INK; ctx.font=`700 ${6.2*u}px Oswald`; ctx.letterSpacing=`${.01*6.2*u}px`;
  ctx.fillText(shortDate(p.date),m,dateBase);
  ctx.fillStyle=NAVY; ctx.font=`400 ${2.5*u}px "Special Elite"`; ctx.letterSpacing=`${.04*2.5*u}px`;
  ctx.fillText(p.place||"",m,placeBase);

  /* The mute button now sits in the extra bottom strip, so the pull line and handle use the normal right edge. */
  const R=W-m;
  ctx.textAlign="right";
  ctx.fillStyle=NAVY; ctx.font=`400 ${2.4*u}px "Special Elite"`; ctx.letterSpacing=`${.02*2.4*u}px`;
  ctx.fillText("@ww2dispatches",R,placeBase);
  const pull=(p.pull||"").trim();
  if(pull){
    ctx.fillStyle=(fmt==="namethis")?(p.clueColor||NAME_THIS_VIOLET):accent; ctx.font=`600 ${3.3*u}px Oswald`; ctx.letterSpacing=`${.03*3.3*u}px`;
    const lines=wrap(ctx,pull.toUpperCase(),(W-2*m)*.48,2);
    lines.reverse().forEach((ln,i)=>ctx.fillText(ln,R,placeBase-3.6*u-i*3.7*u));
  }
  ctx.restore();
}

/* Called by render.js: returns {x, instagram} as JPEG data URLs (quality .92, same as Dispatch Press). */
window.renderCards = async function(p, photoDataUrl){
  await Promise.all(["700 10px Oswald","600 10px Oswald","500 10px Oswald",'400 10px "Special Elite"'].map(f=>document.fonts.load(f)));
  const img = await new Promise((ok,bad)=>{const i=new Image(); i.onload=()=>ok(i); i.onerror=bad; i.src=photoDataUrl;});
  const out={};
  for (const [kind,w,h] of [["x",1600,1440],["instagram",1080,1350]]) {
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    draw(cv,img,p); out[kind]=cv.toDataURL("image/jpeg",.92);
  }
  return out;
};
/* Living card, vertical 1080 x 1920 for Reels, TikTok, and Shorts. Same parts as the post card,
   rearranged to stay inside the phone safe zone (VSAFE below). */
function stamp(ctx,U,label,accent,cx,cy){
  const u=U*1.35;
  ctx.font=`600 ${2.9*u}px Oswald`; ctx.letterSpacing=`${.14*2.9*u}px`;
  const tw=ctx.measureText(label).width, sw=tw+4*u, sh=5*u;
  ctx.save(); ctx.translate(cx-sw/2,cy); ctx.rotate(-2*Math.PI/180);
  ctx.fillStyle=accent; ctx.fillRect(-sw/2,-sh/2,sw,sh);
  ctx.strokeStyle=PAPER; ctx.lineWidth=.32*u; ctx.strokeRect(-sw/2+.55*u,-sh/2+.55*u,sw-1.1*u,sh-1.1*u);
  ctx.fillStyle=PAPER; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(label,.07*u,.15*u);
  const r=rng(31); ctx.fillStyle=PAPER;
  for(let i=0;i<Math.floor(sw*sh/(u*u)*5);i++){ctx.globalAlpha=.12+r()*.3; const rr=(.04+r()*r()*.22)*u; ctx.beginPath(); ctx.arc(-sw/2+r()*sw,-sh/2+r()*sh,rr,0,Math.PI*2); ctx.fill();}
  ctx.globalAlpha=1; ctx.restore();
}
/* Phone safe zone for 1080 x 1920 (u = 10.8 px), measured from YouTube Shorts and TikTok on an iPhone.
   Tall phones zoom a 9:16 video to fill the screen and trim about 100 px off each side. TikTok's search bar and
   tabs cover the top 250 px, the app buttons cover a right column from about the middle down, and the username
   and caption start near 1640 px. So all text keeps an 11u side margin, the header starts below 250 px, text
   beside the buttons ends by 76u, and nothing sits below 148u (about 1600 px). Footage may run under the buttons. */
const VSAFE={m:11,textRight:76,bottom:148,top:40};
function vFrame(cv,p,label,py,ph){
  const W=cv.width,H=cv.height,ctx=cv.getContext("2d"),u=W/100,m=VSAFE.m*u;
  const [sName,accent]=SERIES[SKEY[(p.series||"").toLowerCase()]||"battle"];
  ctx.fillStyle=PAPER; ctx.fillRect(0,0,W,H);
  if(!grainTile) grainTile=makeGrain();
  ctx.fillStyle=ctx.createPattern(grainTile,"repeat"); ctx.fillRect(0,0,W,H);
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.72);
  vg.addColorStop(0,"rgba(120,88,48,0)"); vg.addColorStop(1,"rgba(120,88,48,.24)"); ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  // Footage window runs edge to edge, so a trimmed side never cuts into a border.
  ctx.clearRect(0,py,W,ph);
  ctx.fillStyle=INK; ctx.fillRect(0,py-.5*u,W,.5*u); ctx.fillRect(0,py+ph,W,.5*u);
  ctx.textAlign="left"; ctx.textBaseline="alphabetic";
  ctx.fillStyle=INK; ctx.font=`700 ${6.2*u}px Oswald`; ctx.letterSpacing=`${.02*6.2*u}px`;
  ctx.fillText("WW2 DISPATCHES",m,py-10*u);
  ctx.fillStyle=NAVY; ctx.font=`400 ${3.1*u}px "Special Elite"`; ctx.letterSpacing=`${.04*3.1*u}px`;
  ctx.fillText(label,m,py-4.6*u);
  stamp(ctx,u*.78,sName.toUpperCase(),accent,W-m,py-9*u);
  return {ctx,u,m,accent,win:[0,py,W,ph]};
}
function drawVertical(cv,p){
  const W=cv.width;
  const vf=(p.format||"").toLowerCase();
  const py=Math.round(VSAFE.top*W/100), ph=Math.round(68*W/100);
  const {ctx,u,m,accent,win}=vFrame(cv,p,"Dispatch "+pad(p.num)+(FORMATS[vf]?" · "+FORMATS[vf]:""),py,ph);
  cv.win=win; cv.problems=[];
  const dateBase=py+ph+10.5*u, placeBase=dateBase+4.6*u, maxW=VSAFE.textRight*u-m;
  ctx.textAlign="left";
  ctx.fillStyle=INK; ctx.font=`700 ${8.4*u}px Oswald`; ctx.letterSpacing=`${.01*8.4*u}px`;
  ctx.fillText(shortDate(p.date),m,dateBase);
  ctx.fillStyle=NAVY; ctx.font=`400 ${3.2*u}px "Special Elite"`; ctx.letterSpacing=`${.04*3.2*u}px`;
  wrap(ctx,p.place||"",maxW,1).forEach(ln=>ctx.fillText(ln,m,placeBase));
  let y=placeBase;
  const pull=(p.pull||"").trim();
  if(pull){
    ctx.fillStyle=accent; ctx.font=`600 ${5*u}px Oswald`; ctx.letterSpacing=`${.03*5*u}px`;
    const pl=wrap(ctx,pull.toUpperCase(),maxW,99);
    if(pl.length>2) cv.problems.push("pull line needs "+pl.length+" lines, the frame holds 2");
    pl.slice(0,2).forEach((ln,i)=>{y=placeBase+7.8*u+i*5.6*u; ctx.fillText(ln,m,y);});
  }
  // The hook: one short typewriter line (two at most) that adds something the pull line doesn't.
  const hook=((p.video&&p.video.hook)||"").trim();
  if(!hook) cv.problems.push("no video.hook in the dispatch JSON");
  else{
    ctx.fillStyle=INK; ctx.font=`400 ${3.6*u}px "Special Elite"`; ctx.letterSpacing="0px";
    const hl=wrap(ctx,hook,maxW,99);
    if(hl.length>2) cv.problems.push("hook needs "+hl.length+" lines, the frame holds 2 (about 45 characters)");
    hl.slice(0,2).forEach((ln,i)=>ctx.fillText(ln,m,y+6.6*u+i*4.8*u));
  }
}

/* Called by living.js: transparent PNG overlays plus the footage window for each shape. */
window.renderOverlays = async function(p0){
  const p={...p0,format:"footage"};
  await Promise.all(["700 10px Oswald","600 10px Oswald","500 10px Oswald",'400 10px "Special Elite"'].map(f=>document.fonts.load(f)));
  const out={};
  for (const [kind,w,h] of [["x",1600,1440],["instagram",1080,1350],["vertical",1080,1920]]) {
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    if(kind==="vertical") drawVertical(cv,p); else draw(cv,null,p);
    out[kind]={png:cv.toDataURL("image/png"),win:cv.win.map(Math.round),problems:cv.problems||[]};
  }
  return out;
};
</script>
</body></html>
