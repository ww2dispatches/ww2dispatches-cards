<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Oswald";font-weight:500;src:url(fonts/oswald-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Oswald";font-weight:700;src:url(fonts/oswald-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Special Elite";font-weight:400;src:url(fonts/special-elite-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"LB";font-style:italic;font-weight:400;src:url(fonts/libre-baskerville-latin-400-italic.woff2) format("woff2")}
body{margin:0}
</style></head>
<body>
<script>
/* Campaign Series Substack art (decided 14 Nov 2026). Same Teletype look as the daily posts so the
   series reads as one thing, but built for Substack:
   cover  1456 x 1048 (Substack's 14:10 post thumbnail). Everything that matters sits inside the middle
          1456 x 762 band, so the 1.91:1 social crop (X, Facebook, link previews) keeps it all.
          Kicker: CAMPAIGN SERIES · series · THE CHRONICLE · PART N OF M. Strip: the part title, then
          BULLETINS · first date TO last date and WW2 DISPATCHES.
   banner 1100 x 220 (and 2200 x 440): the Campaign Series section's email banner. A cream teletype tape
          with feed holes across the dark night colour, no photo, so it fits every campaign. */
const PAPER="#EFE6D2", INK="#1F2A44", RED="#B04A3E", NIGHT="#120F0C";
const MON=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
function parts(v){return v.split("-").map(Number);}
const FULL=["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
function span(a,b){const [y1,m1,d1]=parts(a),[y2,m2,d2]=parts(b);
  if(y1!==y2) return `${d1} ${FULL[m1-1]} ${y1} TO ${d2} ${FULL[m2-1]} ${y2}`;
  if(m1!==m2) return `${d1} ${FULL[m1-1]} TO ${d2} ${FULL[m2-1]} ${y1}`;
  return `${d1} TO ${d2} ${FULL[m1-1]} ${y1}`;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let grain=null;
function makeGrain(){const c=document.createElement("canvas");c.width=c.height=256;const g=c.getContext("2d");
  const d=g.createImageData(256,256),r=rng(7);
  for(let i=0;i<d.data.length;i+=4){d.data[i]=92;d.data[i+1]=71;d.data[i+2]=43;d.data[i+3]=Math.floor(r()*r()*55);}
  g.putImageData(d,0,0);return c;}
function paper(ctx,x,y,w,h,s,shadow=true){
  ctx.save(); if(shadow){ctx.shadowColor="rgba(0,0,0,.5)"; ctx.shadowBlur=16*s; ctx.shadowOffsetY=4*s;}
  ctx.fillStyle=PAPER; ctx.fillRect(x,y,w,h); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  ctx.fillStyle=ctx.createPattern(grain,"repeat"); ctx.fillRect(x,y,w,h); ctx.restore();
}
function cover(cv,img,p){
  /* Revised 14 Nov 2026 (Brian): the photo stays clean, nothing laid over it. A cream panel below holds
     CAMPAIGN SERIES · <SERIES> · PART N OF M, the part title, a one line synopsis in Libre Baskerville
     italic, and the dates. No "bulletins". The panel's text ends inside the 1.91:1 social crop band. */
  const W=cv.width,H=cv.height,ctx=cv.getContext("2d"),warn=[];
  const s=W/1456, band=W/1.91, bandBottom=(H+band)/2;
  const ph=Math.round(H*0.56);
  ctx.fillStyle="#1b1b1b"; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,ph); ctx.clip();
  const iw=img.naturalWidth, ih=img.naturalHeight, z=(p.zoom||100)/100, k=Math.max(W/iw,ph/ih)*z;
  const dw=iw*k, dh=ih*k, fx=p.focusX!=null?p.focusX:50, fy=p.focusY!=null?p.focusY:50;
  ctx.filter="grayscale(1)"; ctx.drawImage(img,-(dw-W)*(fx/100),-(dh-ph)*(fy/100),dw,dh); ctx.restore();
  paper(ctx,0,ph,W,H-ph,s,false);
  ctx.fillStyle=RED; ctx.fillRect(0,ph,W,5*s);
  const padX=64*s, innerW=W-2*padX;
  ctx.textBaseline="alphabetic"; ctx.textAlign="left";
  /* kicker */
  const k1="CAMPAIGN SERIES  ·  "+(p.seriesName||"").toUpperCase()+"  ·  THE CHRONICLE  ·  ", k2=`PART ${p.part} OF ${p.parts}`;
  let kf=24*s; ctx.letterSpacing=`${5*s}px`;
  for(;kf>17*s;kf-=0.5*s){ctx.font=`500 ${kf}px Oswald`; if(ctx.measureText(k1+k2).width<=innerW) break;}
  ctx.font=`500 ${kf}px Oswald`;
  const ky=ph+58*s; ctx.fillStyle=INK; ctx.fillText(k1,padX,ky);
  const k1w=ctx.measureText(k1).width; ctx.fillStyle=RED; ctx.fillText(k2,padX+k1w,ky);
  /* title */
  const title=(p.title||"").trim(); let fs=88*s; ctx.letterSpacing=`${1*s}px`;
  for(;fs>60*s;fs-=1*s){ctx.font=`700 ${fs}px Oswald`; if(ctx.measureText(title).width<=innerW) break;}
  if(ctx.measureText(title).width>innerW) warn.push("title too long: "+title);
  const ty=ky+14*s+fs*0.95; ctx.fillStyle=INK; ctx.fillText(title,padX,ty);
  /* synopsis */
  const syn=(p.synopsis||"").trim(); let ss=34*s; ctx.letterSpacing="0px";
  for(;ss>26*s;ss-=1*s){ctx.font=`italic 400 ${ss}px LB`; if(ctx.measureText(syn).width<=innerW) break;}
  if(ctx.measureText(syn).width>innerW) warn.push("synopsis too long for one line: "+syn);
  const sy=ty+16*s+ss*1.1; ctx.fillStyle="#3a3a3a"; ctx.fillText(syn,padX,sy);
  /* dates and name */
  const dy=sy+50*s;
  if(dy>bandBottom-8*s) warn.push("panel text runs past the social crop");
  ctx.font=`500 ${24*s}px Oswald`; ctx.letterSpacing=`${5*s}px`; ctx.fillStyle=INK;
  ctx.fillText(span(p.first,p.last),padX,dy);
  ctx.textAlign="right"; ctx.fillStyle=RED; ctx.fillText("WW2 DISPATCHES",W-padX,dy); ctx.textAlign="left";
  return warn;
}
function banner(cv){
  const W=cv.width,H=cv.height,ctx=cv.getContext("2d"),s=W/1100;
  ctx.fillStyle=NIGHT; ctx.fillRect(0,0,W,H);
  const th=118*s, ty=(H-th)/2;
  paper(ctx,0,ty,W,th,s);
  /* feed holes: one small row like real teletype tape, plus faint perforation lines */
  ctx.fillStyle=NIGHT;
  for(let x=14*s;x<W;x+=22*s){ctx.beginPath(); ctx.arc(x,ty+18*s,3.2*s,0,Math.PI*2); ctx.fill();}
  ctx.fillStyle="rgba(31,42,68,.18)";
  for(let x=14*s;x<W;x+=22*s){for(const yy of [th-14*s]){ctx.beginPath(); ctx.arc(x,ty+yy,1.8*s,0,Math.PI*2); ctx.fill();}}
  ctx.textBaseline="alphabetic"; ctx.textAlign="center";
  ctx.font=`700 ${50*s}px Oswald`; ctx.letterSpacing=`${8*s}px`; ctx.fillStyle=INK;
  ctx.fillText("THE CHRONICLE",W/2,ty+76*s);
  ctx.font=`400 ${19*s}px "Special Elite"`; ctx.letterSpacing=`${1*s}px`; ctx.fillStyle=RED;
  ctx.fillText("A WW2 DISPATCHES CAMPAIGN SERIES  ·  EACH CAMPAIGN, IN FULL",W/2,ty+102*s);
  ctx.textAlign="left";
}
window.renderCover=async function(p,photoDataUrl){
  await Promise.all(["700 10px Oswald","500 10px Oswald",'400 10px "Special Elite"',"italic 400 10px LB"].map(f=>document.fonts.load(f)));
  if(!grain) grain=makeGrain();
  const img=await new Promise((ok,bad)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=bad;i.src=photoDataUrl;});
  const cv=document.createElement("canvas");cv.width=1456;cv.height=1048;
  const warn=cover(cv,img,p); return {cover:cv.toDataURL("image/jpeg",.92),warn};
};
window.renderBanner=async function(){
  await Promise.all(["700 10px Oswald",'400 10px "Special Elite"'].map(f=>document.fonts.load(f)));
  if(!grain) grain=makeGrain();
  const out={};
  for(const [k,w,h] of [["x1",1100,220],["x2",2200,440]]){const cv=document.createElement("canvas");cv.width=w;cv.height=h;banner(cv);out[k]=cv.toDataURL("image/png");}
  return out;
};
</script>
</body></html>
