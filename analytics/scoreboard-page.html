<style>
/* Layout: one narrow column, a stamped telegram header, four tabs; cream paper by day, Night Dispatch by dark. */
:root {
  --paper: #EDE4CF; --sheet: #F6F0E1; --ink: #1A1612; --muted: #6B6052; --rule: #D3C7AC;
  --stamp: #B04A3E; --navy: #3D5884; --good: #4E6B2F; --weak: #A0442F; --soft: #E3D8BE;
  --display: "Oswald", "Arial Narrow", Arial, sans-serif;
  --type: "Special Elite", "Courier New", Courier, monospace;
  --body: "Source Sans 3", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #120F0C; --sheet: #1C1814; --ink: #EDE4CF; --muted: #A89C88; --rule: #3A322A;
  --stamp: #D06A5C; --navy: #8EA6CF; --good: #9DBB6E; --weak: #E08A72; --soft: #2A241E; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #120F0C; --sheet: #1C1814; --ink: #EDE4CF; --muted: #A89C88; --rule: #3A322A;
  --stamp: #D06A5C; --navy: #8EA6CF; --good: #9DBB6E; --weak: #E08A72; --soft: #2A241E; color-scheme: dark }

[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font: 16px/1.5 var(--body); }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 18px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px; }
header { display: grid; gap: 4px; border-bottom: 3px double var(--stamp); padding-bottom: 12px; }
.kicker { font: 13px var(--type); color: var(--stamp); letter-spacing: .08em; }
h1 { font: 700 30px/1.1 var(--display); letter-spacing: .02em; margin: 0; text-transform: uppercase; }
.meta { font: 13px var(--type); color: var(--navy); }
nav { display: flex; gap: 6px; flex-wrap: wrap; }
nav button { font: 500 15px var(--display); letter-spacing: .06em; text-transform: uppercase; border: 1.5px solid var(--rule);
  background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 3px; cursor: pointer; }
nav button[aria-selected="true"] { border-color: var(--stamp); color: var(--stamp); background: var(--sheet); }
nav button:focus-visible, .post summary:focus-visible, select:focus-visible, .chip:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
section { display: grid; gap: 16px; }
h2 { font: 700 19px var(--display); letter-spacing: .05em; text-transform: uppercase; margin: 0; text-wrap: balance; }
h3 { font: 600 16px var(--body); margin: 0; }
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.empty { border-style: dashed; text-align: left; }
.empty .stamp { justify-self: start; }
.stamp { font: 700 12px var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--stamp);
  border: 2px solid var(--stamp); padding: 2px 8px; transform: rotate(-2deg); display: inline-block; }
.prose { display: grid; gap: 8px; max-width: 65ch; }
.prose p, .prose ul, .prose ol { margin: 0; }
.prose ul, .prose ol { padding-left: 20px; display: grid; gap: 6px; }
.prose h2 { font-size: 17px; margin-top: 8px; }
.prose code { font-size: 14px; background: var(--soft); padding: 0 4px; border-radius: 2px; }
.list { display: grid; gap: 8px; }
.post { background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; min-width: 0; }
.post summary { list-style: none; display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; cursor: pointer; }
.post summary::-webkit-details-marker { display: none; }
.thumb { width: 56px; height: 70px; object-fit: cover; border-radius: 2px; background: var(--soft); display: block; }
.thumb.blank { display: grid; place-items: center; font: 11px var(--type); color: var(--muted); }
.who { min-width: 0; display: grid; gap: 2px; }
.who .line1 { font: 12px var(--type); color: var(--navy); }
.who .title { font-weight: 600; line-height: 1.25; }
.who .line3 { font-size: 13px; color: var(--muted); }
.scores { display: grid; gap: 4px; justify-items: end; font-variant-numeric: tabular-nums; }
.score { font: 700 15px var(--display); letter-spacing: .03em; }
.score small { font: 11px var(--body); color: var(--muted); letter-spacing: 0; margin-right: 4px; text-transform: uppercase; }
.hi { color: var(--good); } .lo { color: var(--weak); }
.pill { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .06em; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--rule); color: var(--muted); }
.pill.final { border-color: var(--navy); color: var(--navy); }
.detail { padding: 0 12px 12px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th { font: 600 12px var(--body); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--rule); }
td { padding: 6px 8px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
td.num, th.num { text-align: right; }
td a { color: var(--navy); }
.dim { color: var(--muted); }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { font: 600 13px var(--body); border: 1px solid var(--rule); background: transparent; color: var(--muted); padding: 4px 10px; border-radius: 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
select { font: 14px var(--body); padding: 4px 8px; background: var(--sheet); color: var(--ink); border: 1px solid var(--rule); border-radius: 3px; }
.scroll { overflow-x: auto; }
.chart text { fill: var(--muted); font: 11px var(--body); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.note { font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .post[open] .detail { animation: open .18s ease-out; } @keyframes open { from { opacity: .4 } } }
</style>

lessons, not rules: the Project docs stay the rules, and anything here that would change a rule goes to Brian first as a Schedule Board task. The Tuesday review rewrites this file each week; older versions live in git and in `analytics/reviews/`.\n\nUpdated Tue 27 Oct 2026, after the first real review (`analytics/reviews/2026-10-27.md`). The method is in the Project's Analytics doc.\n\n## How to read this\n* **Reach:** a post's views compared with a typical post of the same kind on the same platform (1.0 is typical).\n* **Response:** weighted reactions per 100 views (like 1, comment 3, repost, quote, share, or save 2), compared the same way.\n* Cards, Name This, and videos are each judged only against their own kind.\n* **Hunch:** seen in one review, or fewer than 5 posts. The runs may lean toward it but never treat it as settled.\n* **Pattern:** holds across 3 weekly reviews with 5 or more posts on each side. The runs follow it.\n* **Rule change:** a pattern that would change a Project doc. Filed for Brian to approve.\n\n## Patterns\nNone yet. The earliest a pattern can form is the 10 Nov review.\n\n## For the Wednesday research run (events and subjects)\nHunches, all from one review:\n1. **Famous faces and famous voices lift reach.** Cards centered on leaders averaged Reach 2.1 over 6 posts; Tojo's portrait (4.1) and Churchill's broadcast (3.5) led all cards. *Lean:* when a date offers a well known person at a real moment, it is a strong pick, especially for an evening Photo of the Day or Quote of the Day.\n2. **Barrier breaking stories about groups often left out of WW2 coverage get strong reactions.** The WAVES card (the Navy's first Black women officers) drew Response 5.5, the highest of any card. Still one post. *Lean:* when a date offers a genuine story of this kind (the Tuskegee Airmen, the 6888th, Navajo Code Talkers, the Nisei 442nd, the WASPs, women in war work), it is a strong pick on its merits. Choose it for the story, never as a token, and keep the usual verification and somber subject rules.\n3. **Quiet procedural events reach fewer people.** The tin can drive (0.26), the Nuremberg indictment (0.46), and the UN Charter (0.55) were the weakest cards. *Lean:* favor the event with a vivid moment or person; save procedural events for days with nothing stronger.\n4. **Turning points and firsts do well.** Aachen (the first German city to fall), MacArthur's return, and Mark Clark's secret landing all reached about 1.8 to 2.5. *Lean:* a clear \"first\" or turning point is a good 8 a.m. pick.\n5. **For videos, the film matters more than how it opens.** The best Living Cards (Aachen, Alamein) had clear, famous film of a big moment. *Lean:* when choosing between events for the noon video, pick the one with the strongest real film; a Living Card beat a Story Card on every platform so far (Reach 2.2 against 0.68, 3 and 2 posts).\n\n## For the Thursday video run (openings, sound, kinds)\nHunches:\n1. **Story Cards are the weak spot.** Both narrated Story Cards (No. 011 and No. 015) ran over a minute, opened on a still, and drew 36 and 18 YouTube views (typical 537), with 6 to 11 percent hold on Instagram. *Lean:* keep Story Cards as the fallback only; Test C (proposed, not approved) would try shorter ones.\n2. **A dark opening did not hurt.** The Alamein Living Card opens nearly black and held best of all (45 percent on TikTok, 38 on Instagram). The Leyte card, opening on people standing still, held worst (15 to 16 percent). *Lean:* an opening with something happening, even at night, beats a still group.\n3. **YouTube Shorts is the biggest video platform so far** (Living Cards 800 to 1,600 views each). TikTok second (300 to 700).\n* Keep tagging the real opening from the finished video's frames for Test B.\n\n## For the Friday cards run (hooks, formats, captions, questions)\nHunches:\n1. **People and faces lead evening photos.** Portrait cards averaged Reach 3.8 (2 posts), groups 1.3 (4), machines 1.1 (5). *Lean:* for a Photo of the Day, prefer a strong photo of a person or people.\n2. **Quote of the Day can be the best post of the week** when the line is famous and hopeful (Churchill: 90 reactions, 6 reposts). One post. *Lean:* pick quotes people will want to share.\n3. **Spec Sheets that open on the machine draw less.** The three before Test A averaged Reach 0.54. The first Test A post (No. 018 Johnston, opening on the 327 men and 141 survivors) drew 1,102 Threads views in two days. *Run:* follow Test A.\n4. **5 p.m. cards ran ahead of 8 a.m. cards** (Reach 1.56 against 1.25, Response 1.75 against 1.01, 8 and 9 posts). First reading only; nothing changes.\n* Engagement questions: only one card with a question has posted (No. 020, too early). Compare once there are 5 with and 5 without.\n\n## Active tests\nEach test changes one thing, so the result can be read clearly.\n* **Test A, Spec Sheet hooks** (approved by Brian 21 Oct 2026). Spec Sheets open their captions with the human stakes, then the machine (for example \"Eleven men died, and the ship still made it home. Here is why.\" rather than the ship's class). Measure: Reach and Response against earlier Spec Sheets. Test posts so far: No. 018 Johnston, No. 020 Mustang. Review 3 Nov 2026.\n* **Test B, action first openings** (approved by Brian 21 Oct 2026). Every Living Card opens on motion or action in its first two seconds; tag the actual opening in `themes.video.opening`. Measure: hold on Instagram and TikTok against earlier Living Cards. Test posts so far: No. 017, 019, 021. Review 3 Nov 2026.\n\n## Proposed tests (waiting for Brian's OK; do not run)\n* **Test C, shorter Story Cards.** The next two Story Cards run under 30 seconds and open on the most dramatic still in the kit. Measure: YouTube views and Instagram and TikTok hold against No. 011 and No. 015. Review 17 Nov 2026.\n\n## Watch, do not act yet\n* X, Instagram cards, and Facebook cards get too few views to judge (typical 15, 6, and 2).\n* Facebook Reels drew about 300 views each on 22 to 24 Oct, then almost none on 25 and 26 Oct. Recheck next week before the Facebook versus Substack decision.\n* Two Threads posts drew almost nothing (the Alamein card, 11 views; the Musashi Name This, 6). Brian has a check task. Watch for more.\n* Name This: three cards so far (Tirpitz 2,364 Threads views, B-17 632, Musashi 6). Compare ship against aircraft after five.\n* Name This on Instagram (test ends 31 Oct): 12 and 4 views so far, about the same as Instagram cards.\n* Instagram follows from posts: 0 so far.\n\n## For Brian to decide\nNothing this week. The 3 Nov review brings Facebook versus Substack, Name This on Instagram, and the Test A and B results. Test C is proposed in the review.\n", "latest_review": "# Weekly review, Tue 27 Oct 2026\n\nThe first real review. Snapshot `analytics/snapshots/2026-10-27.json` (158 Buffer posts sent 16 to 27 Oct). 33 posts matched, 22 scored (6 final, 16 provisional), 8 too early (sent Sunday to Tuesday). Everything below is a hunch: one review, and most groups are under 5 posts.\n\n## Summary\nThreads is still where the cards live: a typical card there now draws 456 views, and the best evening posts drew three to four times that. The strongest cards were a famous face or a famous voice (Tojo's portrait, Churchill's broadcast to France) and big turning point mornings (Aachen, Mark Clark's secret landing, MacArthur at Leyte). Videos now reach more people than cards on every platform except Threads: YouTube Shorts gave the Living Cards 800 to 1,600 views each and TikTok 300 to 700, while the two narrated Story Cards drew almost nothing on YouTube (36 and 18 views). Quiet procedural subjects (the tin can drive, the Nuremberg indictment, the UN Charter) and Spec Sheets drew least on Threads. Instagram, X, and Facebook cards still sit below 20 views each and cannot be judged. Two odd results need a look: the Alamein morning card and the Musashi Name This drew only 11 and 6 views on Threads, and Facebook Reels fell from about 300 views each (22 to 24 Oct) to almost none on 25 and 26 Oct.\n\n## Best posts\n* **No. 004, Tojo takes power** (Photo of the Day, Statecraft): Threads 1,902 views, Reach 4.1. A tight portrait of a man everyone knows, with a sharp pull line (\"The Razor takes over\"). Response was below typical (0.65), so it was seen more than it was liked: a villain draws eyes, not hearts.\n* **No. 010, Churchill speaks to France** (Quote of the Day): Threads 1,614 views, 90 reactions, 6 reposts, Reach 3.5, Response 3.3. The best all round card so far. A famous voice, a hopeful line people want to share, on the anniversary of the broadcast.\n* **No. 006, the WAVES open to Black women** (Photo of the Day): Response 5.5, by far the highest. Still the clearest sign that barrier breaking stories about people often left out draw real feeling. One post only.\n* **No. 009, Aachen surrenders**, card and Living Card: card Reach 2.5 on Threads; the video drew 1,608 on YouTube, 1,472 on Threads, 727 on TikTok (33 percent hold). A first (first German city to fall) with clear film.\n* **No. 013, El Alamein Living Card**: best video hold (45 percent on TikTok, 38 on Instagram) and 1,360 YouTube views, even though it opens nearly black on night footage. That cuts against last week's worry about the dark opening.\n* **Name This, Tirpitz** (18 Oct): 2,364 Threads views and 5 comments, the most viewed post of the fortnight.\n\n## Weakest posts\n* **No. 013, the barrage at El Alamein card** (8 a.m.): 11 Threads views, against 456 typical. The same event's video did very well, so the subject is not the cause. Buffer shows the post landed in History Threads as normal. Most likely Threads held it back; worth a look in the app (task filed).\n* **Name This, Musashi** (24 Oct): 6 Threads views. Same puzzle as above; the Tirpitz and B-17 cards drew 2,364 and 632.\n* **No. 005, Tin cans go to war** (Reach 0.26), **No. 003, the Nuremberg indictment** (0.46), **No. 015, UN Charter takes effect** (0.55): quiet procedural subjects with a document, a poster, or a staged photo. They fit last week's hunch.\n* **Spec Sheets before Test A**: No. 002 Kearny (0.39), No. 008 TDR drone (0.47), No. 014 Sherman (0.76). All opened on the machine.\n* **The two Story Cards** (No. 011 Mark Clark, No. 015 UN Charter): YouTube 36 and 18 views against 537 typical; Instagram hold 11 and 6 percent. Both are over a minute long and open on a still (a submarine, a scene), with narration.\n\n## What changed since last week\nThis is the first review on live data; last week's playbook came from a test run.\n* Hunch 1 (people and faces lead evening photos): held. Portraits Reach 3.8 (2 posts), groups 1.3 (4 posts), machines 1.1 (5 posts).\n* Hunch 2 (Spec Sheets draw less on Threads): held for the three Spec Sheets before Test A (Reach 0.54 average).\n* Hunch 3 (barrier breaking stories): held, still one post.\n* Hunch 4 (quiet procedural events reach fewer people): held, now three posts.\n* Hunch 5 (video hold depends on the opening): mixed. The dark Alamein opening held best; the Leyte opening on people standing still held worst (15 to 16 percent).\n* New hunches: Living Cards out reach Story Cards (3 against 2 posts); leaders and famous voices lift card Reach (leaders 2.1 over 6 posts); videos now out reach cards on YouTube, TikTok, Instagram, and Facebook.\n* Groups with 5 or more on each side (first reading, not patterns): 5 p.m. cards out did 8 a.m. cards (Reach 1.56 against 1.25, Response 1.75 against 1.01); Statecraft (2.21) and Battle Lines (1.51) both reach above typical.\n* Instagram follows from posts: 0 so far.\n\n## Tests\n* **Test A, Spec Sheet hooks** (review 3 Nov): two test posts so far, both too early to score. No. 018 Johnston opened \"Of the 327 men aboard USS Johnston, only 141 came home.\" and drew 1,102 Threads views, 39 reactions, and 3 reposts in about two days, the best Spec Sheet yet. No. 020 Mustang opened on Britain's need for fighters and has 88 views after one day. Early read is promising; no result until 3 Nov.\n* **Test B, action first openings** (review 3 Nov): the test videos are No. 017 Taffy 3 (motion), No. 019 Hornet and No. 021 Snipe (combat or firing). Hornet holds 37 percent on TikTok and 26 on Instagram, Taffy 3 29 and 17. Those sit above the Leyte opening and below Alamein. No result until 3 Nov.\n\n## Roadmap open decisions\n* **Facebook versus Substack** (decide after 3 Nov): Facebook static cards average 2 views and do nothing. Facebook Reels drew 304 to 347 views each on 22 to 24 Oct, then almost none on 25 and 26 Oct (possibly a Buffer lag; recheck next week). So far Facebook is worth keeping only for Reels.\n* **Name This on Instagram** (decide 3 Nov): two cards, 12 and 4 views, about the same as Instagram cards (6). No sign it helps or hurts yet; the 28 and 31 Oct cards finish the test.\n* **Posting times**: the 5 p.m. card ahead of 8 a.m. is a first reading. It needs three reviews before it means anything.\n* **Onyx voice**: the two narrated Story Cards were the weakest videos. Too few to judge the voice itself, since both also opened on a still and ran over a minute.\n\n## For Brian\n* One check task on the Schedule Board: open the Alamein card (23 Oct, 8 a.m.) and the Musashi Name This (24 Oct) in the Threads app and see whether the view counts match Buffer (11 and 6). If they do, Threads held them back; if not, Buffer is lagging. Optional, two minutes.\n* Nothing needs a decision this week. The 3 Nov review brings the Facebook, Name This on Instagram, and Test A and B results.\n* Proposed test (only with your OK): **Test C, shorter Story Cards**. The next two Story Cards run under 30 seconds and open on the most dramatic still in the kit, so we can see whether length or the narration is what loses viewers. Measure: YouTube views and Instagram and TikTok hold against the first two Story Cards. Review 17 Nov.\n", "reviews": ["2026-10-27"], "unmatched": [{"id": "6ad241dacb7df35161471a9d", "service": "twitter", "sent": "2026-10-16T15:25:16.582Z", "link": "https://x.com/2110501302996492288/status/2111116270703649105"}, {"id": "6ad241e6cb7df35161471be4", "service": "instagram", "sent": "2026-10-16T15:25:34.766Z", "link": "https://www.instagram.com/p/Dej2axEIDhI/"}, {"id": "6ad241f0709e3eab3f94215a", "service": "threads", "sent": "2026-10-16T15:25:45.948Z", "link": "https://www.threads.com/@ww2dispatches/post/Dej2cGYlmnV"}, {"id": "6ad2fdd31694d771d51d6429", "service": "twitter", "sent": "2026-10-17T04:47:16.575Z", "link": "https://x.com/2110501302996492288/status/2111318100519858184"}, {"id": "6ad2fdd787c4935770af7231", "service": "instagram", "sent": "2026-10-17T04:47:28.760Z", "link": "https://www.instagram.com/p/DelSMCDgPYa/"}, {"id": "6ad2fde3c34368e4b0a8d804", "service": "threads", "sent": "2026-10-17T04:47:39.506Z", "link": "https://www.threads.com/@ww2dispatches/post/DelSNatgKza"}, {"id": "6ad556dd0b0d72757a428011", "service": "tiktok", "sent": "2026-10-20T18:03:40.901Z", "link": "https://tiktok.com/@ww2dispatches/video/7698812053380664589"}, {"id": "6ad556da769b457934e3a466", "service": "youtube", "sent": "2026-10-20T18:02:21.320Z", "link": "https://www.youtube.com/shorts/txZLxb52GEo"}], "tag_problems": []};
const D = DATA || { posts: [], groups: {}, weekly_views: [], baselines: [], reviews: [], snapshots: [], playbook: "", latest_review: "", unmatched: [], tag_problems: [], first_review: "2026-10-28", rules: {} };
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtDate = s => { if (!s) return ""; const d = new Date(s.slice(0, 10) + "T12:00:00"); return d.toLocaleDateString("en-US", { weekday: "short", day: "numeric", month: "short" }); };
const fmtLift = v => v == null || v === "" ? "·" : Number(v).toFixed(1);
const cls = v => v == null || v === "" ? "dim" : v >= 1.25 ? "hi" : v <= 0.8 ? "lo" : "";

function md(text) {
  const out = []; let list = null;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>").replace(/`(.+?)`/g, "<code>$1</code>");
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of text.split("\n")) {
    const line = raw.trimEnd();
    let m;
    if (!line.trim()) { close(); continue; }
    if ((m = line.match(/^#{1}\s+(.*)/)) && !line.startsWith("##")) { close(); continue; } // page title is the header
    if ((m = line.match(/^#{2,}\s+(.*)/))) { close(); out.push(`<h2>${inline(m[1])}</h2>`); continue; }
    if ((m = line.match(/^\s*[\*\-]\s+(.*)/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    if ((m = line.match(/^\s*\d+\.\s+(.*)/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    close(); out.push(`<p>${inline(line)}</p>`);
  }
  close();
  return out.join("");
}

function section(md, name) {
  const re = new RegExp("^## " + name + "\\s*$", "m"); const m = md.match(re);
  if (!m) return ""; const rest = md.slice(m.index + m[0].length); const end = rest.search(/^## /m);
  return (end < 0 ? rest : rest.slice(0, end)).trim();
}

function postRow(p) {
  const img = p.image ? `<img class="thumb" src="${p.image}" alt="">` : `<div class="thumb blank">${p.kind === "Video" ? "Video" : "Card"}</div>`;
  const label = [p.num ? "No. " + p.num : p.kind, p.kind === "Video" ? p.format : p.kind === "Card" ? p.format : "", p.series].filter(Boolean).join(" · ");
  const rows = p.platforms.map(q => `<tr><td>${q.link ? `<a href="${esc(q.link)}" target="_blank" rel="noopener">${esc(q.platform)}</a>` : esc(q.platform)}</td>
    <td class="num">${q.views === "" ? "·" : Number(q.views).toLocaleString()}</td><td class="num">${q.likes === "" ? "·" : q.likes}</td>
    <td class="num">${q.comments === "" ? "·" : q.comments}</td><td class="num ${cls(q.reach_lift)}">${fmtLift(q.reach_lift)}</td>
    <td class="num ${cls(q.response_lift)}">${fmtLift(q.response_lift)}</td><td class="num">${q.hold_pct === "" ? "·" : q.hold_pct + "%"}</td>
    <td class="dim">${q.counts === "yes" ? "counts" : "not yet"}</td></tr>`).join("");
  return `<details class="post"><summary>${img}
    <div class="who"><div class="line1">${esc(label)}</div><div class="title">${esc(p.title)}</div>
      <div class="line3">${fmtDate(p.date)} · ${esc(p.slot)} · <span class="pill ${p.status === "final" ? "final" : ""}">${esc(p.status)}</span></div></div>
    <div class="scores"><div class="score ${cls(p.reach)}"><small>Reach</small>${fmtLift(p.reach)}</div><div class="score ${cls(p.response)}"><small>Response</small>${fmtLift(p.response)}</div></div>
  </summary><div class="detail"><table><thead><tr><th>Platform</th><th class="num">Views</th><th class="num">Likes</th><th class="num">Comments</th><th class="num">Reach</th><th class="num">Resp.</th><th class="num">Hold</th><th>Scored</th></tr></thead><tbody>${rows}</tbody></table></div></details>`;
}

function renderWeek() {
  const el = $("#view-week");
  const scored = D.posts.filter(p => p.reach != null);
  if (!D.latest_review && !scored.length) {
    el.innerHTML = `<div class="panel empty"><span class="stamp">Awaiting first returns</span>
      <h2>First review ${fmtDate(D.first_review)}</h2>
      <p class="prose">Every Wednesday evening this page fills in: the week's best and weakest posts, what changed, the tests running, and anything that needs your decision. Posts are scored once they are two days old, and a platform starts counting once its typical post reaches ${D.rules.floor || 50} views.</p></div>`;
    return;
  }
  const decide = section(D.playbook, "For Brian to decide");
  const recent = scored.slice().sort((a, b) => b.reach - a.reach);
  const best = recent.slice(0, 3), weak = recent.slice(-3).reverse().filter(p => !best.includes(p));
  el.innerHTML = `${decide && !/^Nothing/i.test(decide) ? `<div class="panel"><span class="stamp">Needs your decision</span><div class="prose">${md(decide)}</div></div>` : ""}
    ${D.latest_review ? `<div class="panel"><div class="prose">${md(D.latest_review)}</div></div>` : ""}
    <h2>Best</h2><div class="list">${best.map(postRow).join("") || '<p class="note">No scored posts yet.</p>'}</div>
    ${weak.length ? `<h2>Weakest</h2><div class="list">${weak.map(postRow).join("")}</div>` : ""}`;
}

let kindFilter = "all", sortBy = "newest";
function renderPosts() {
  const el = $("#view-posts");
  let ps = D.posts.filter(p => kindFilter === "all" || p.kind === kindFilter);
  const key = { newest: null, reach: "reach", response: "response" }[sortBy];

  const chip = (v, t) => `<button class="chip" data-kind="${v}" aria-pressed="${kindFilter === v}">${t}</button>`;
  el.innerHTML = `<div class="controls">${chip("all", "All")}${chip("Card", "Cards")}${chip("Video", "Videos")}${chip("Name This", "Name This")}
    <label for="sort" class="note" style="margin-left:auto">Sort</label><select id="sort"><option value="newest">Newest</option><option value="reach">Reach</option><option value="response">Response</option></select></div>
    <div class="list">${ps.map(postRow).join("") || '<div class="panel empty"><p class="note">Posts appear here after the first Wednesday review.</p></div>'}</div>
    <p class="note">Reach and Response: 1.0 is a typical post of the same kind on the same platform. Tap a post for each platform.</p>`;
  $("#sort").value = sortBy;
  el.querySelectorAll(".chip").forEach(b => b.onclick = () => { kindFilter = b.dataset.kind; renderPosts(); });
  $("#sort").onchange = e => { sortBy = e.target.value; renderPosts(); };
}

const PCOL = { Threads: "var(--ink)", YouTube: "var(--stamp)", Instagram: "#B8862B", TikTok: "var(--navy)", X: "#5E6B3A", Facebook: "var(--muted)" };
function chart(weeks) {
  const plats = Object.keys(PCOL).filter(k => weeks.some(w => w[k]));
  if (!weeks.length || !plats.length) return '<p class="note">The weekly chart starts after the first review.</p>';
  const W = 640, H = 220, L = 46, R = 12, T = 12, B = 30;
  const max = Math.max(...weeks.flatMap(w => plats.map(k => w[k] || 0)), 1);
  const step = Math.pow(10, Math.floor(Math.log10(max))); const top = Math.ceil(max / step) * step;
  const x = i => weeks.length === 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (weeks.length - 1);
  const y = v => T + (H - T - B) * (1 - v / top);
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Views per week by platform">`;
  for (let g = 0; g <= 4; g++) { const v = top * g / 4; svg += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule)" fill="none"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v >= 1000 ? (v / 1000) + "k" : v}</text>`; }
  weeks.forEach((w, i) => { svg += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${fmtDate(w.week).replace(/^\w+, /, "")}</text>`; });
  plats.forEach(k => { const pts = weeks.map((w, i) => `${x(i)},${y(w[k] || 0)}`).join(" ");
    svg += `<polyline points="${pts}" fill="none" stroke="${PCOL[k]}" stroke-width="2.5"/>`;
    weeks.forEach((w, i) => svg += `<circle cx="${x(i)}" cy="${y(w[k] || 0)}" r="${i === weeks.length - 1 ? 4 : 2.5}" fill="${PCOL[k]}"/>`); });
  svg += "</svg>";
  return `<div class="scroll">${svg}</div><div class="legend">${plats.map(k => `<span><i style="background:${PCOL[k]}"></i>${k}</span>`).join("")}</div>`;
}
function groupTable(rows) {
  if (!rows || !rows.length) return '<p class="note">No scored posts yet.</p>';
  let last = "";
  return `<div class="scroll"><table><thead><tr><th>Group</th><th class="num">Posts</th><th class="num">Reach</th><th class="num">Resp.</th><th></th></tr></thead><tbody>${rows.map(r => {
    const head = r.group !== last ? `<tr><td colspan="5" style="padding-top:12px"><strong>${esc(r.group)}</strong></td></tr>` : ""; last = r.group;
    return head + `<tr><td>${esc(r.value)}</td><td class="num">${r.posts}</td><td class="num ${r.usable ? cls(r.reach) : "dim"}">${fmtLift(r.reach)}</td><td class="num ${r.usable ? cls(r.response) : "dim"}">${fmtLift(r.response)}</td><td class="dim">${r.usable ? "" : "not enough data"}</td></tr>`; }).join("")}</tbody></table></div>`;
}
function renderTrends() {

  el.innerHTML = `<div class="panel"><h2>Views per week</h2>${chart(D.weekly_views)}<p class="note">Weeks run Sunday to Saturday, by the day each post went out.</p></div>
    <div class="panel"><h2>Typical post, last 4 weeks</h2>${base ? `<div class="scroll"><table><thead><tr><th>Kind</th><th>Platform</th><th class="num">Views</th><th class="num">Posts</th><th>Scored</th></tr></thead><tbody>${base}</tbody></table></div>` : '<p class="note">Fills in after the first review.</p>'}
      <p class="note">A platform starts counting once its typical post reaches ${D.rules.floor || 50} views over ${D.rules.min_posts || 5} or more posts.</p></div>
    <div class="panel"><h2>Cards by group</h2>${groupTable(D.groups.Card)}</div>
    <div class="panel"><h2>Videos by group</h2>${groupTable(D.groups.Video)}</div>
    <div class="panel"><h2>Name This by group</h2>${groupTable(D.groups["Name This"])}</div>`;

function renderPlaybook() {
  const el = $("#view-playbook");

  el.innerHTML = `<div class="panel"><div class="prose">${md(D.playbook || "The playbook appears here.")}</div></div>

    ${checks.length ? `<details class="panel"><summary class="note">Data checks (${checks.length})</summary><ul class="note">${checks.map(c => `<li>${esc(c)}</li>`).join("")}</ul></details>` : ""}`;
}

function show(view) {

}
$("#meta").textContent = D.generated ? `Updated ${fmtDate(D.generated)} · ${D.snapshots.length} weekly pull${D.snapshots.length === 1 ? "" : "s"} · ${D.posts.length} posts` : `First review ${fmtDate(D.first_review)}`;

if (["week", "posts", "trends", "playbook"].includes(h)) start = h; else { try { start = localStorage.getItem("scoreboard-view") || "week"; } catch (e) {} }
