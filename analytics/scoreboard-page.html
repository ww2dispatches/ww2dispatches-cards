<style>
/* Layout: one narrow column, a stamped telegram header, five tabs; cream paper by day, Night Dispatch by dark. */
:root {
  --paper: #EDE4CF; --sheet: #F6F0E1; --ink: #1A1612; --muted: #6B6052; --rule: #D3C7AC;
  --stamp: #B04A3E; --navy: #3D5884; --good: #4E6B2F; --weak: #A0442F; --soft: #E3D8BE;
  --display: "Oswald", "Arial Narrow", Arial, sans-serif;
  --type: "Special Elite", "Courier New", Courier, monospace;
  --body: "Source Sans 3", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #120F0C; --sheet: #1C1814; --ink: #EDE4CF; --muted: #A89C88; --rule: #3A322A;
  --stamp: #D06A5C; --navy: #8EA6CF; --good: #9DBB6E; --weak: #E08A72; --soft: #2A241E; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #120F0C; --sheet: #1C1814; --ink: #EDE4CF; --muted: #A89C88; --rule: #3A322A;
  --stamp: #D06A5C; --navy: #8EA6CF; --good: #9DBB6E; --weak: #E08A72; --soft: #2A241E; color-scheme: dark }

[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font: 16px/1.5 var(--body); }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 18px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px; }
header { display: grid; gap: 4px; border-bottom: 3px double var(--stamp); padding-bottom: 12px; }
.kicker { font: 13px var(--type); color: var(--stamp); letter-spacing: .08em; }
h1 { font: 700 30px/1.1 var(--display); letter-spacing: .02em; margin: 0; text-transform: uppercase; }
.meta { font: 13px var(--type); color: var(--navy); }
nav { display: flex; gap: 6px; flex-wrap: wrap; }
nav button { font: 500 15px var(--display); letter-spacing: .06em; text-transform: uppercase; border: 1.5px solid var(--rule);
  background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 3px; cursor: pointer; }
nav button[aria-selected="true"] { border-color: var(--stamp); color: var(--stamp); background: var(--sheet); }
nav button:focus-visible, .post summary:focus-visible, select:focus-visible, .chip:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
section { display: grid; gap: 16px; }
h2 { font: 700 19px var(--display); letter-spacing: .05em; text-transform: uppercase; margin: 0; text-wrap: balance; }
h3 { font: 600 16px var(--body); margin: 0; }
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.empty { border-style: dashed; text-align: left; }
.panel > .stamp { justify-self: start; margin-bottom: 4px; }
.stamp { font: 700 12px var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--stamp);
  border: 2px solid var(--stamp); padding: 2px 8px; transform: rotate(-2deg); display: inline-block; }
.prose { display: grid; gap: 8px; max-width: 65ch; }
.prose p, .prose ul, .prose ol { margin: 0; }
.prose ul, .prose ol { padding-left: 20px; display: grid; gap: 6px; }
.prose h2 { font-size: 17px; margin-top: 8px; }
.prose code { font-size: 14px; background: var(--soft); padding: 0 4px; border-radius: 2px; }
.list { display: grid; gap: 8px; }
.post { background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; min-width: 0; }
.post summary { list-style: none; display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; cursor: pointer; }
.post summary::-webkit-details-marker { display: none; }
.thumb { width: 56px; height: 70px; object-fit: cover; border-radius: 2px; background: var(--soft); display: block; }
.thumb.blank { display: grid; place-items: center; font: 11px var(--type); color: var(--muted); }
.who { min-width: 0; display: grid; gap: 2px; }
.who .line1 { font: 12px var(--type); color: var(--navy); }
.who .title { font-weight: 600; line-height: 1.25; }
.who .line3 { font-size: 13px; color: var(--muted); }
.scores { display: grid; gap: 4px; justify-items: end; font-variant-numeric: tabular-nums; }
.score { font: 700 15px var(--display); letter-spacing: .03em; }
.score small { font: 11px var(--body); color: var(--muted); letter-spacing: 0; margin-right: 4px; text-transform: uppercase; }
.hi { color: var(--good); } .lo { color: var(--weak); }
.pill { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .06em; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--rule); color: var(--muted); }
.pill.final { border-color: var(--navy); color: var(--navy); }
.detail { padding: 0 12px 12px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th { font: 600 12px var(--body); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--rule); }
td { padding: 6px 8px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
td.num, th.num { text-align: right; }
td a { color: var(--navy); }
.dim { color: var(--muted); }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { font: 600 13px var(--body); border: 1px solid var(--rule); background: transparent; color: var(--muted); padding: 4px 10px; border-radius: 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
select { font: 14px var(--body); padding: 4px 8px; background: var(--sheet); color: var(--ink); border: 1px solid var(--rule); border-radius: 3px; }
.scroll { overflow-x: auto; }
.chart text { fill: var(--muted); font: 11px var(--body); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.note { font-size: 13px; color: var(--muted); }
/* Your Call: plain, scannable form controls in the body font. */
.q { display: grid; gap: 8px; }
.q .ask { font-weight: 600; font-size: 17px; }
.q .why { font-size: 14px; color: var(--muted); max-width: 65ch; }
.q .effects { font-size: 14px; display: grid; gap: 2px; }
.q .effects b { font-weight: 600; }
.opts { display: grid; gap: 6px; }
.opts label { display: flex; gap: 10px; align-items: baseline; cursor: pointer; font-size: 16px; }
.opts input[type=radio] { width: 18px; height: 18px; accent-color: var(--stamp); flex: none; }
.veto { display: grid; gap: 6px; }
.veto .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--rule); }
.veto .row:last-child { border-bottom: 0; }
.veto .gid { font: 12px var(--type); color: var(--navy); }
.veto button { font: 600 13px var(--body); border: 1.5px solid var(--rule); background: transparent; color: var(--muted); padding: 4px 12px; border-radius: 3px; cursor: pointer; }
.veto button[aria-pressed="true"] { border-color: var(--weak); color: var(--weak); background: var(--soft); }
.nums { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.nums label { display: grid; gap: 3px; font-size: 13px; color: var(--muted); }
.nums input, textarea.answer { font: 16px var(--body); padding: 6px 8px; background: var(--paper); color: var(--ink); border: 1px solid var(--rule); border-radius: 3px; width: 100%; box-sizing: border-box; }
textarea.answer { min-height: 90px; resize: vertical; }
.q.carried .ask::after { content: "Still open from last week"; font: 600 11px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--stamp); border: 1px solid var(--stamp); border-radius: 10px; padding: 1px 7px; margin-left: 8px; vertical-align: middle; }
.submit { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.submit button { font: 700 15px var(--display); letter-spacing: .1em; text-transform: uppercase; background: var(--stamp); color: #fff; border: 0; padding: 10px 20px; border-radius: 3px; cursor: pointer; }
.submit button[disabled] { opacity: .5; cursor: default; }
.submit button.quiet { background: transparent; color: var(--navy); border: 1.5px solid var(--navy); }
.status { font-size: 14px; color: var(--muted); }
.status.ok { color: var(--good); font-weight: 600; }
.status.bad { color: var(--weak); }
.q[data-locked] .opts label, .q[data-locked] .veto button { pointer-events: none; }
.q[data-locked] .opts input:not(:checked) + span, .q[data-locked] .veto button[aria-pressed="false"] { opacity: .45; }
@media (prefers-reduced-motion: no-preference) { .post[open] .detail { animation: open .18s ease-out; } @keyframes open { from { opacity: .4 } } }
</style>

ytics doc.\n\n## How to read this\n* **Reach:** a post's views compared with a typical post of the same kind on the same platform (1.0 is typical).\n* **Response:** weighted reactions per 100 views (like 1, comment 3, repost, quote, share, or save 2), compared the same way.\n* Cards, Name This, and videos are each judged only against their own kind.\n* **Hunch:** seen in one review, or fewer than 5 posts. The runs may lean toward it but never treat it as settled.\n* **Pattern:** holds across 3 weekly reviews with 5 or more posts on each side. The runs follow it.\n* **Rule change:** a pattern that would change a Project doc. Filed for Brian to approve.\n* \"Review 2 of 3\" means a finding has held with enough posts in two weekly reviews; one more and it becomes a pattern.\n* **Read this week's card numbers with care.** Threads, the only card platform that counts, cut the account's reach by about 80 percent from 5 Nov (see Watch). Cards posted 5 to 9 Nov score low for reasons outside the card.\n\n## Patterns\n1. **Battle Lines cards out reach Blueprint and Home Front cards** (pattern since 10 Nov 2026, three reviews). Battle Lines 2.47 (median 2.20) over 16 posts, Blueprint 1.31 (median 0.93) over 11, Home Front 0.73 (median 0.67) over 7. *Follow:* see research item 1.\n\n## For the Wednesday research run (events and subjects)\n1. **Give the 8 a.m. slot to Battle Lines when the date allows** (pattern). Combat, a turning point, or a stand against the odds, with usable film, is the strongest 8 a.m. pick. Blueprint and Home Front fit better in the evening slots or as a Spec Sheet, unless the story has a vivid person or moment.\n2. **Combat and turning points do well** (review 2 of 3). Combat 2.30 over 18 posts, turning point 2.38 over 10. Rommel's retreat from Alamein (8.36, the best card ever) came at the end of a week of Alamein posts: following a famous campaign across several days seems to build an audience for its climax. *Lean:* when a big campaign runs over several dates, follow it to its turning point.\n3. **Home front and everyday subjects reach fewer people, but those who see them react** (review 2 of 3). Home front theater 1.02 (median 0.70) over 14, civilians 0.91 over 9, everyday life 0.57 over 6, with Response 1.1 to 1.3. *Lean:* pick a home front story when it has a vivid person or a striking moment (WAVES, This Is the Army, the Fu-Go schoolgirls), not a procedure. Never pick two procedural subjects for the same day.\n4. **A famous leader at a dramatic moment does well; leaders at procedure do not** (hunch, restarted 10 Nov). Tojo takes power (4.97), Churchill to France (4.23), Greece says no (3.62) are among the best cards, but the leader group's median is only 0.73, pulled down by elections and speeches (FDR's third and fourth terms, both very low, though the second fell into the Threads drop). *Lean:* a leader at a decision under pressure, yes; an election result or a routine speech, only with a strong human angle, and never two in the same week.\n5. **A human story inside a big machine or strike lifts the card** (hunch). Manila Bay through Admiral Shima watching from shore (3.47), the Fu-Go balloon through the schoolgirls who glued it (2.91), the Spruce Goose through Hughes's dare (2.95). *Lean:* when picking a machine or air strike, check the facts for a person whose moment can carry the hook.\n6. **Stories of groups often left out of WW2 coverage draw the strongest feeling** (hunch, 3 posts). WAVES (Response 4.38), the Lost Battalion (Reach 4.47, Response 2.58); the Navajo code talkers card was held back by Threads (29 views) and never got a fair test. *Lean:* when a date offers a genuine story of this kind, it is a strong pick on its merits. Choose it for the story, never as a token, with the usual verification and somber subject rules.\n7. **For videos, the film decides the reach.** Living Cards: YouTube median 1,286 against 256 for Story Cards; TikTok hold 44 against 19 percent. Supercharge drew 2,610 YouTube views, the most yet. *Lean:* when choosing between events for a day, the one with strong usable combat or action film usually wins. Desert Victory and Navy combat film keep serving well; short newsreel of crowds can hold too (Roosevelt's fourth term, 75 percent on TikTok).\n8. **Same day pairs:** the Fu-Go Story and Spec Sheet both did well (1.75 and 2.91), the draft lottery pair both did poorly. A strong subject carries two posts; a weak one sinks both.\n\n## For the Thursday video runs (openings, sound, kinds, second cuts)\n1. **Story Cards are the weak spot** (review 1 of 3 with 5 posts each side). Reach 0.80 against 1.31; Instagram hold 12 against 30 percent; TikTok 19 against 44. *Run:* follow Test C below for every Story Card, and make one only when no usable film exists.\n2. **Openings: combat or firing slightly ahead of motion** (hunch, 6 posts each). Reach 1.31 against 1.03. Not settled; keep following the Videos doc, and tag the real opening from the finished video's frames at about 0.3 and 2 seconds.\n3. **Silent film and period sound do equally well** (silent 1.34 over 9, period sound 1.32 over 5). Keep the film's own sound when it has it. No. 039 (Manila Bay) is still the only video with a music bed, tagged \"music\".\n4. **Short and plain can hold.** No. 043 (Roosevelt's fourth term, silent newsreel) held 75 percent on TikTok, and Torch 63 percent on Instagram, the best holds yet. A short film with one clear thing happening keeps viewers.\n5. **YouTube Shorts is the biggest video platform** (Living Cards typically about 1,300 views), then TikTok (about 480). Instagram Reels steady at about 125. Facebook Reels draw about 270 to 300 when they show but often vanish (see Watch).\n6. **Second cuts and 7 p.m. videos** start 15 Nov. No data yet; each is scored as its own post, and the review compares 7 p.m. with noon and second cuts with first cuts once each has 5 posts.\n7. Brian dropped Test B as a standing practice on 4 Nov; the playbook no longer adds anything to the Videos doc on openings.\n\n## For the Friday cards run (hooks, formats, captions, questions)\n1. **Hooks that name a person, a price, or a dare work best.** \"Hitler's order was victory or death. Rommel chose neither.\" (8.36), \"To reach 211 trapped Texans, a unit of Japanese American soldiers paid with hundreds of casualties\" (4.47), \"Admiral Shima was ashore at a staff conference when the planes came\" (3.47), \"Howard Hughes told the Senate that if his giant plane failed, he would probably leave the country\" (2.95, 12 comments). *Lean:* open on one person's choice or a number that hurts, in one or two short sentences.\n2. **Spec Sheets reach less than Story cards** (review 2 of 3 by median: 0.67 against 1.86), but the best ones (Spruce Goose, Fu-Go, Johnston) rival the stories. Brian dropped Test A as a standing practice on 4 Nov, so the hook is the cards run's call under the Cards doc; the numbers still favor a Spec Sheet whose machine has a human story inside it.\n3. **Faces lead the evening photos** (first reading with 6 posts). Portraits 2.36 (median 2.14); place or scene photos 0.50 over 4 and people in action 0.67 over 5 trail. *Lean:* for a Photo of the Day or Quote of the Day, prefer a strong photo of a person.\n4. **Quote of the Day works when the line is famous** (hunch, 4 posts, median 0.39). Churchill to France (4.23) far beat FDR's lines; Hitler's \"few small pockets\" fell into the Threads drop. *Lean:* choose a line people already half know or will want to share.\n5. **Engagement questions:** 7 cards, median 0.27, average 1.82 (one big winner). Too mixed to judge. Keep following the Cards doc.\n6. **Slots:** 8 a.m. led again (2.09 against 1.29), the second review running. Not a pattern yet; nothing changes. The 2:30 p.m. Axis cards start 15 Nov and are compared once they have 5 posts.\n\n## Active tests\nEach test changes one thing, so the result can be read clearly.\n* **Test C, shorter Story Cards** (approved by Brian 28 Oct 2026). Every Story Card runs under 30 seconds and opens on the most dramatic still in the kit, so it feels more intense. Measure: YouTube views and Instagram and TikTok hold against the earlier Story Cards (No. 011, 015, 025, 030, 041; YouTube 22 to 659 views, Instagram hold 6 to 19 percent, TikTok 11 to 24 percent). No test Story Card has posted yet (Nos. 043 to 049 were all Living Cards). Review 24 Nov 2026, or later if fewer than two test Story Cards have posted by then.\n\n## Closed tests\n* **Test A, human first Spec Sheet hooks** (21 Oct to 3 Nov): Response doubled, Reach not clearly better. Brian chose not to keep it as standing practice (4 Nov).\n* **Test B, action first Living Card openings** (21 Oct to 3 Nov): TikTok hold 43 against 32 percent, Instagram flat. Brian chose not to keep it as standing practice (4 Nov).\n\n## Proposed tests (waiting for Brian's OK; do not run)\nNone this week. A card test can't be read while Threads reach is cut.\n\n## Watch, do not act yet\n* **Threads cut distribution from 5 Nov.** About 300 views a day from 6 to 9 Nov against 1,400 to 3,500 before; five of the last eight scored cards under 60 views. Every series, format, and slot fell alike. 10 Nov shows a partial recovery (Ike in the mud, 569 views in a day). Brian is asked to check the Threads account status. Keep every Threads post in History Threads as the Brief says. Before the drop, Threads also held back single posts now and then (about one in six).\n* **Statecraft:** 1.56 by average but median 0.65 over 12, after its late week posts fell into the Threads drop. Watch whether it recovers.\n* **Facebook Reels vanish often:** 10 of 22 Reels drew 0 to 5 views, including the last four (043, 045, 047, 049). When they show they draw about 270 to 300.\n* **YouTube:** the Torch video drew only 17 views in two days against a typical 1,201. One post; watch whether Shorts dip again.\n* **X:** cards draw a typical 20 views; Brian's hand posted Lunch Drops drew 12 to 365 (the 442nd led). X videos have not traveled again since Taffy 3.\n* **Instagram cards** stay under 15 views (typical 7); Facebook cards 1.\n* **Name This:** machines (6 puzzles) Reach 2.68; still only one person puzzle (Gable, 0.66).\n* **Followers** (Brian, 4 Nov): X 11, Instagram 12, Threads 37, TikTok 45, YouTube 15, Facebook 3. TikTok grew from 5 to 45 in a week. Instagram follows credited to posts: 0.\n\n## For Brian to decide\nFiled on the Schedule Board and the Scoreboard's Your Call tab:\n1. Name This on Instagram (asked again; Claude's view: end it).\n2. Optional check: Threads account status, after the 5 Nov drop.\nDecided 4 Nov: keep Facebook for everything; drop Tests A and B as standing practice.\n", "latest_review": "# Weekly review, Tue 10 Nov 2026\n\nSnapshot `analytics/snapshots/2026-11-10.json` (244 Buffer posts sent 27 Oct to 10 Nov). With the two earlier snapshots, 79 posts matched: 73 scored (56 final, 17 provisional) and 6 too early (sent Monday and Tuesday). 25 unmatched posts are all expected: the old and new welcome posts, the replaced 20 Oct TikTok and YouTube copies, the Sunday share posts for issues 001 and 002, and ten Lunch Drop posts Brian made by hand on X. No tag problems. The Buffer connector still returns no post links, so links were carried from older pulls where they existed; matching uses Buffer ids, so no score is affected.\n\n## Summary\nThe week split in two. Through Thursday 5 Nov the account had its best days yet: Rommel's retreat from Alamein became the best card ever (Threads 3,210 views, Reach 8.36), Manila Bay (3.47), the Fu-Go balloon Spec Sheet (2.91), and the Spruce Goose Spec Sheet (2.95, 12 Threads comments) all ran far above typical, and Threads drew 3,566 views on 4 Nov. Then, from the 5 p.m. post on 5 Nov, Threads views fell by about 80 percent across the board: about 300 a day from 6 to 9 Nov against 1,400 to 3,500 before, with five of the last eight scored cards under 60 Threads views. It hit every series, format, and sl const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtDate = s => { if (!s) return ""; const d = new Date(s.slice(0, 10) + "T12:00:00"); return d.toLocaleDateString("en-US", { weekday: "short", day: "numeric", month: "short" }); };
const fmtLift = v => v == null || v === "" ? "·" : Number(v).toFixed(1);
const cls = v => v == null || v === "" ? "dim" : v >= 1.25 ? "hi" : v <= 0.8 ? "lo" : "";

function md(text) {
  const out = []; let list = null;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>").replace(/`(.+?)`/g, "<code>$1</code>");
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of text.split("\n")) {
    const line = raw.trimEnd();
    let m;
    if (!line.trim()) { close(); continue; }
    if ((m = line.match(/^#{1}\s+(.*)/)) && !line.startsWith("##")) { close(); continue; } // page title is the header
    if ((m = line.match(/^#{2,}\s+(.*)/))) { close(); out.push(`<h2>${inline(m[1])}</h2>`); continue; }
    if ((m = line.match(/^\s*[\*\-]\s+(.*)/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    if ((m = line.match(/^\s*\d+\.\s+(.*)/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    close(); out.push(`<p>${inline(line)}</p>`);
  }
  close();
  return out.join("");
}

function section(md, name) {
  const re = new RegExp("^## " + name + "\\s*$", "m"); const m = md.match(re);
  if (!m) return ""; const rest = md.slice(m.index + m[0].length); const end = rest.search(/^## /m);
  return (end < 0 ? rest : rest.slice(0, end)).trim();
}

function postRow(p) {
  const img = p.image ? `<img class="thumb" src="${p.image}" alt="">` : `<div class="thumb blank">${p.kind === "Video" ? "Video" : "Card"}</div>`;
  const label = [p.num ? "No. " + p.num : p.kind, p.kind === "Video" ? p.format : p.kind === "Card" ? p.format : "", p.series].filter(Boolean).join(" · ");
  const rows = p.platforms.map(q => `<tr><td>${q.link ? `<a href="${esc(q.link)}" target="_blank" rel="noopener">${esc(q.platform)}</a>` : esc(q.platform)}</td>
    <td class="num">${q.views === "" ? "·" : Number(q.views).toLocaleString()}</td><td class="num">${q.likes === "" ? "·" : q.likes}</td>
    <td class="num">${q.comments === "" ? "·" : q.comments}</td><td class="num ${cls(q.reach_lift)}">${fmtLift(q.reach_lift)}</td>
    <td class="num ${cls(q.response_lift)}">${fmtLift(q.response_lift)}</td><td class="num">${q.hold_pct === "" ? "·" : q.hold_pct + "%"}</td>
    <td class="dim">${q.counts === "yes" ? "counts" : "not yet"}</td></tr>`).join("");
  return `<details class="post"><summary>${img}
    <div class="who"><div class="line1">${esc(label)}</div><div class="title">${esc(p.title)}</div>
      <div class="line3">${fmtDate(p.date)} · ${esc(p.slot)} · <span class="pill ${p.status === "final" ? "final" : ""}">${esc(p.status)}</span></div></div>
    <div class="scores"><div class="score ${cls(p.reach)}"><small>Reach</small>${fmtLift(p.reach)}</div><div class="score ${cls(p.response)}"><small>Response</small>${fmtLift(p.response)}</div></div>
  </summary><div class="detail"><table><thead><tr><th>Platform</th><th class="num">Views</th><th class="num">Likes</th><th class="num">Comments</th><th class="num">Reach</th><th class="num">Resp.</th><th class="num">Hold</th><th>Scored</th></tr></thead><tbody>${rows}</tbody></table></div></details>`;
}

    el.innerHTML = `<div class="panel empty"><span class="stamp">Awaiting first returns</span>
      <h2>First review ${fmtDate(D.first_review)}</h2>
      <p class="prose">Every Wednesday evening this page fills in: the week's best and weakest posts, what changed, the tests running, and anything that needs your decision. Posts are scored once they are two days old, and a platform starts counting once its typical post reaches ${D.rules.floor || 50} views.</p></div>`;
    return;
  }
  const decide = section(D.playbook, "For Brian to decide");
  const recent = scored.slice().sort((a, b) => b.reach - a.reach);
  const best = recent.slice(0, 3), weak = recent.slice(-3).reverse().filter(p => !best.includes(p));
  el.innerHTML = `${decide && !/^Nothing/i.test(decide) ? `<div class="panel"><span class="stamp">Needs your decision</span><div class="prose">${md(decide)}</div></div>` : ""}
    ${D.latest_review ? `<div class="panel"><div class="prose">${md(D.latest_review)}</div></div>` : ""}
    <h2>Best</h2><div class="list">${best.map(postRow).join("") || '<p class="note">No scored posts yet.</p>'}</div>
    ${weak.length ? `<h2>Weakest</h2><div class="list">${weak.map(postRow).join("")}</div>` : ""}`;
}

let kindFilter = "all", sortBy = "newest";
function renderPosts() {
  const el = $("#view-posts");
  let ps = D.posts.filter(p => kindFilter === "all" || p.kind === kindFilter);
  const key = { newest: null, reach: "reach", response: "response" }[sortBy];
  if (key) ps = ps.slice().sort((a, b) => (b[key] ?? -1) - (a[key] ?? -1));
  const chip = (v, t) => `<button class="chip" data-kind="${v}" aria-pressed="${kindFilter === v}">${t}</button>`;
  el.innerHTML = `<div class="controls">${chip("all", "All")}${chip("Card", "Cards")}${chip("Video", "Videos")}${chip("Name This", "Name This")}
    <label for="sort" class="note" style="margin-left:auto">Sort</label><select id="sort"><option value="newest">Newest</option><option value="reach">Reach</option><option value="response">Response</option></select></div>
    <div class="list">${ps.map(postRow).join("") || '<div class="panel empty"><p class="note">Posts appear here after the first Wednesday review.</p></div>'}</div>
    <p class="note">Reach and Response: 1.0 is a typical post of the same kind on the same platform. Tap a post for each platform.</p>`;
  $("#sort").value = sortBy;
  el.querySelectorAll(".chip").forEach(b => b.onclick = () => { kindFilter = b.dataset.kind; renderPosts(); });
  $("#sort").onchange = e => { sortBy = e.target.value; renderPosts(); };
}

const PCOL = { Threads: "var(--ink)", YouTube: "var(--stamp)", Instagram: "#B8862B", TikTok: "var(--navy)", X: "#5E6B3A", Facebook: "var(--muted)" };
function chart(weeks) {
  const plats = Object.keys(PCOL).filter(k => weeks.some(w => w[k]));
  if (!weeks.length || !plats.length) return '<p class="note">The weekly chart starts after the first review.</p>';
  const W = 640, H = 220, L = 46, R = 12, T = 12, B = 30;
  const max = Math.max(...weeks.flatMap(w => plats.map(k => w[k] || 0)), 1);
  const step = Math.pow(10, Math.floor(Math.log10(max))); const top = Math.ceil(max / step) * step;
  const x = i => weeks.length === 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (weeks.length - 1);
  const y = v => T + (H - T - B) * (1 - v / top);
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Views per week by platform">`;
  for (let g = 0; g <= 4; g++) { const v = top * g / 4; svg += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule)" fill="none"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v >= 1000 ? (v / 1000) + "k" : v}</text>`; }
  weeks.forEach((w, i) => { svg += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${fmtDate(w.week).replace(/^\w+, /, "")}</text>`; });
  plats.forEach(k => { const pts = weeks.map((w, i) => `${x(i)},${y(w[k] || 0)}`).join(" ");
    svg += `<polyline points="${pts}" fill="none" stroke="${PCOL[k]}" stroke-width="2.5"/>`;
    weeks.forEach((w, i) => svg += `<circle cx="${x(i)}" cy="${y(w[k] || 0)}" r="${i === weeks.length - 1 ? 4 : 2.5}" fill="${PCOL[k]}"/>`); });
  svg += "</svg>";
  return `<div class="scroll">${svg}</div><div class="legend">${plats.map(k => `<span><i style="background:${PCOL[k]}"></i>${k}</span>`).join("")}</div>`;
}
function groupTable(rows) {
  if (!rows || !rows.length) return '<p class="note">No scored posts yet.</p>';
  let last = "";
  return `<div class="scroll"><table><thead><tr><th>Group</th><th class="num">Posts</th><th class="num">Reach</th><th class="num">Resp.</th><th></th></tr></thead><tbody>${rows.map(r => {
    const head = r.group !== last ? `<tr><td colspan="5" style="padding-top:12px"><strong>${esc(r.group)}</strong></td></tr>` : ""; last = r.group;
    return head + `<tr><td>${esc(r.value)}</td><td class="num">${r.posts}</td><td class="num ${r.usable ? cls(r.reach) : "dim"}">${fmtLift(r.reach)}</td><td class="num ${r.usable ? cls(r.response) : "dim"}">${fmtLift(r.response)}</td><td class="dim">${r.usable ? "" : "not enough data"}</td></tr>`; }).join("")}</tbody></table></div>`;
}
function renderTrends() {
  const el = $("#view-trends");
  const base = D.baselines.map(b => `<tr><td>${esc({ card: "Cards", video: "Videos", namethis: "Name This" }[b.kind] || b.kind)}</td><td>${esc(b.platform)}</td><td class="num">${Math.round(b.typical_views).toLocaleString()}</td><td class="num">${b.posts}</td><td class="${b.counts ? "" : "dim"}">${b.counts ? "counts" : "not yet"}</td></tr>`).join("");
  el.innerHTML = `<div class="panel"><h2>Views per week</h2>${chart(D.weekly_views)}<p class="note">Weeks run Sunday to Saturday, by the day each post went out.</p></div>
    <div class="panel"><h2>Typical post, last 4 weeks</h2>${base ? `<div class="scroll"><table><thead><tr><th>Kind</th><th>Platform</th><th class="num">Views</th><th class="num">Posts</th><th>Scored</th></tr></thead><tbody>${base}</tbody></table></div>` : '<p class="note">Fills in after the first review.</p>'}
      <p class="note">A platform starts counting once its typical post reaches ${D.rules.floor || 50} views over ${D.rules.min_posts || 5} or more posts.</p></div>
    <div class="panel"><h2>Cards by group</h2>${groupTable(D.groups.Card)}</div>
    <div class="panel"><h2>Videos by group</h2>${groupTable(D.groups.Video)}</div>
    <div class="panel"><h2>Name This by group</h2>${groupTable(D.groups["Name This"])}</div>`;
}
function renderPlaybook() {
  const el = $("#view-playbook");
  const checks = [...(D.tag_problems || []).map(t => "Tag: " + t), ...(D.unmatched || []).map(u => `Unmatched ${u.service} post sent ${fmtDate(u.sent)} (${u.id})`)];
  el.innerHTML = `<div class="panel"><div class="prose">${md(D.playbook || "The playbook appears here.")}</div></div>
    ${D.reviews.length ? `<div class="panel"><h2>Past reviews</h2><p class="note">${D.reviews.map(fmtDate).join(" · ")}. Each is saved in the cards repo under analytics/reviews.</p></div>` : ""}
    ${checks.length ? `<details class="panel"><summary class="note">Data checks (${checks.length})</summary><ul class="note">${checks.map(c => `<li>${esc(c)}</li>`).join("")}</ul></details>` : ""}`;
}

/* Your Call: the Tuesday review's summary and its questions, answered here and saved in the
   artifact's database (one document per week, answers/<week>), which the Wednesday research
   run and the next Tuesday review read back. The page never writes to the repo. */
let yc = { db: null, doc: null, saved: null, locked: false, answers: {} };
function ycValues() {
  const C = D.checkin; const out = {};
  for (const q of C.questions || []) {
    if (q.type === "veto") out[q.id] = [...document.querySelectorAll(`.veto button[data-q="${q.id}"][aria-pressed="true"]`)].map(b => b.dataset.gid);
    else if (q.type === "numbers") { const o = {}; for (const f of q.fields) { const v = $(`[data-q="${q.id}"][data-f="${f}"]`)?.value; if (v !== "" && v != null) o[f] = Number(v); } out[q.id] = o; }
    else if (q.type === "text") out[q.id] = ($(`[data-q="${q.id}"]`)?.value || "").trim();
    else out[q.id] = document.querySelector(`input[name="${q.id}"]:checked`)?.value || "";
  }
  return out;
}
function ycAnswered(q, a) {
  const v = a?.[q.id];
  if (v == null) return false;
  if (q.type === "veto") return true;  // a saved submission with no vetoes is still an answer
  if (q.type === "numbers") return Object.keys(v).length > 0;
  return String(v).trim() !== "";
}
function questionHtml(q, a) {
  const v = a?.[q.id];
  let body = "";
  if (q.type === "veto") body = `<div class="veto">${(q.groups || []).map(g => `<div class="row"><div><div class="gid">${esc(g.id)}</div><div>${esc(g.link)}</div></div>
      <button type="button" data-q="${esc(q.id)}" data-gid="${esc(g.id)}" aria-pressed="${Array.isArray(v) && v.includes(g.id)}">${Array.isArray(v) && v.includes(g.id) ? "Vetoed" : "Veto"}</button></div>`).join("")}</div>`;
  else if (q.type === "numbers") body = `<div class="nums">${q.fields.map(f => `<label>${esc(f)}<input type="number" min="0" inputmode="numeric" data-q="${esc(q.id)}" data-f="${esc(f)}" value="${v?.[f] ?? ""}"></label>`).join("")}</div>`;
  else if (q.type === "text") body = `<textarea class="answer" data-q="${esc(q.id)}" placeholder="${esc(q.placeholder || "")}">${esc(v || "")}</textarea>`;
  else body = `<div class="opts">${(q.options || []).map(o => `<label><input type="radio" name="${esc(q.id)}" value="${esc(o)}" ${v === o ? "checked" : ""}><span>${esc(o)}</span></label>`).join("")}</div>`;
  const effects = [q.if_yes ? `<div><b>If yes:</b> ${esc(q.if_yes)}</div>` : "", q.if_blank ? `<div><b>If left blank:</b> ${esc(q.if_blank)}</div>` : ""].join("");
  return `<div class="panel q ${q.carried ? "carried" : ""}" data-id="${esc(q.id)}"><div class="ask">${esc(q.ask)}</div>
    ${q.why ? `<div class="why">${esc(q.why)}</div>` : ""}${body}${effects ? `<div class="effects">${effects}</div>` : ""}</div>`;
}
function ycRefreshTab() {
  const C = D.checkin; const b = $("#tab-yourcall");
  if (!C || !C.questions) { b.textContent = "Your Call"; return; }
  const open = C.questions.filter(q => !ycAnswered(q, yc.saved?.answers)).length;
  b.textContent = open && !yc.saved ? `Your Call · ${open} open` : open ? `Your Call · ${open} left` : "Your Call ✓";
}
function renderYourCall() {
  const el = $("#view-yourcall"); const C = D.checkin;
  if (!C || !C.questions) {
    el.innerHTML = `<div class="panel empty"><span class="stamp">Nothing to call yet</span><p class="note">Each Tuesday review leaves its summary and its questions for you here. Your answers are saved in this page and read by the Wednesday research run.</p></div>`;
    ycRefreshTab(); return;
  }
  const a = yc.saved?.answers;
  const when = yc.saved?.submitted ? new Date(yc.saved.submitted).toLocaleString("en-US", { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) : "";
  el.innerHTML = `<div class="panel"><span class="stamp">Your call · week of ${esc(fmtDate(C.week))}</span>${C.summary ? `<div class="prose">${md(C.summary)}</div>` : ""}</div>
    ${C.questions.map(q => questionHtml(q, a)).join("")}
    <div class="submit"><button type="button" id="yc-submit">Submit answers</button><button type="button" class="quiet" id="yc-edit" hidden>Edit answers</button><span class="status" id="yc-status"></span></div>
    <p class="note">The Wednesday research run reads these first thing; the next Tuesday review records them. You can change an answer any time before then. Anything else, tell Claude in the Project.</p>`;
  el.querySelectorAll(".veto button").forEach(b => b.onclick = () => { const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on); b.textContent = on ? "Vetoed" : "Veto"; });
  $("#yc-submit").onclick = ycSubmit;
  $("#yc-edit").onclick = () => { yc.locked = false; ycLock(false); $("#yc-status").textContent = "Editing. Submit again when done."; $("#yc-status").className = "status"; };
  if (yc.saved) { ycLock(true); $("#yc-status").textContent = `Submitted ${when}.`; $("#yc-status").className = "status ok"; }
  else if (yc.db === null && yc.ready) { $("#yc-submit").disabled = true; $("#yc-status").textContent = "Answers can't be saved from this view. Tell Claude in the Project instead."; $("#yc-status").className = "status bad"; }
  ycRefreshTab();
}
function ycLock(on) {
  document.querySelectorAll("#view-yourcall .q").forEach(q => on ? q.setAttribute("data-locked", "") : q.removeAttribute("data-locked"));
  document.querySelectorAll("#view-yourcall input, #view-yourcall textarea").forEach(i => i.disabled = on);
  $("#yc-submit").hidden = on; $("#yc-edit").hidden = !on;
}
async function ycSubmit() {
  const C = D.checkin; const st = $("#yc-status"); const btn = $("#yc-submit");
  if (!yc.db) { st.textContent = "Not connected; nothing saved. Tell Claude in the Project instead."; st.className = "status bad"; return; }
  btn.disabled = true; st.textContent = "Saving…"; st.className = "status";
  const body = { week: C.week, submitted: new Date().toISOString(), answers: ycValues() };
  try {
    await yc.db.doc("answers/" + C.week).set(body);
    yc.saved = body; renderYourCall();
  } catch (e) {
    btn.disabled = false; st.className = "status bad";
    st.textContent = e?.code === "invalid_argument" ? "This view can't write answers (sign in as the owner). Nothing saved." : "Couldn't save (" + (e?.code || "error") + "). Try again in a moment.";
  }
}
async function ycInit() {
  renderYourCall();
  const C = D.checkin; if (!C || !C.questions) return;
  try { yc.db = window.claude?.use ? await window.claude.use("db") : null; } catch (e) { yc.db = null; }
  yc.ready = true;
  if (yc.db) {
    try { const s = await yc.db.doc("answers/" + C.week).get(); if (s.exists) yc.saved = s.data(); } catch (e) {}
  }
  renderYourCall();
}

function show(view) {
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === view));
  document.querySelectorAll("section[role=tabpanel]").forEach(s => s.hidden = s.id !== "view-" + view);
  try { localStorage.setItem("scoreboard-view", view); } catch (e) {}
}
$("#meta").textContent = D.generated ? `Updated ${fmtDate(D.generated)} · ${D.snapshots.length} weekly pull${D.snapshots.length === 1 ? "" : "s"} · ${D.posts.length} posts` : `First review ${fmtDate(D.first_review)}`;
renderWeek(); renderPosts(); renderTrends(); renderPlaybook(); ycInit();
document.querySelectorAll("nav button").forEach(b => b.onclick = () => show(b.dataset.view));
let start = "week"; const h = location.hash.slice(1);
if (["week", "posts", "trends", "playbook", "yourcall"].includes(h)) start = h; else { try { start = localStorage.getItem("scoreboard-view") || "week"; } catch (e) {} }
show(start);
</script>
