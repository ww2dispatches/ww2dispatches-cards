<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch Scoreboard</title>
<style>
/* Same look as the Planning Board and Dispatch Schedule: plain system font, light paper, white cards, sticky top bar. */
:root{
  --bg:#f7f6f2; --card:#ffffff; --ink:#24221f; --soft:#6b665e; --line:#e3dfd6; --line2:#efece5;
  --green:#3f8a4f; --amber:#c98a12; --red:#c0392b; --hiBg:#e3f1e5; --loBg:#fde3df; --midBg:#f1efe9;
  --attnBg:#fff4f2; --attnLine:#f0cfc9; --input:#ffffff; --onInk:#ffffff; --tagBg:#f1efe9;
  --bl:#B04A3E; --hf:#5E6B3A; --bp:#3D5884; --sc:#B8862B; --nt:#5B4B8A; --fl:#6b4fa0;
  color-scheme:light;
}
html[data-theme=dark]{
  --bg:#141518; --card:#1d1f23; --ink:#e9e6e0; --soft:#a39f97; --line:#33363c; --line2:#282a2f;
  --green:#5cb36e; --amber:#d99a26; --red:#e2604f; --hiBg:#21382a; --loBg:#4a2622; --midBg:#2a2c30;
  --attnBg:#3a2321; --attnLine:#5e3530; --input:#16181b; --onInk:#141518; --tagBg:#2a2c30;
  --bl:#d06a5c; --hf:#9aab6a; --bp:#7f9bd0; --sc:#d6a64a; --nt:#9a88cf; --fl:#a58ad6;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px 8px}
.titlebar{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-size:19px;margin:0;font-weight:700}
#meta{color:var(--soft);font-size:13px}
.controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.controls>button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-height:36px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;border-right:1px solid var(--line);background:transparent;padding:6px 14px;min-height:36px;white-space:nowrap}
#tabs{max-width:100%;overflow-x:auto}
.legend button{background:none;border:0;padding:2px 0;display:inline-flex;gap:6px;align-items:center;color:var(--soft)}
.legend button.offp{opacity:.35;text-decoration:line-through}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--onInk)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;font-weight:700;line-height:20px;text-align:center}
.seg button.on .badge{background:#fff;color:var(--red)}
.badge.ok{background:var(--green)}
.spacer{flex:1}
.status{margin:8px 16px 0;color:var(--soft);font-size:13px}
.status:empty{display:none}
main{max-width:1180px;margin:0 auto;padding:12px 16px 40px}
h2{font-size:16px;margin:18px 0 8px}
h2:first-child{margin-top:4px}
h3{font-size:14px;margin:0 0 6px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.help{font-size:13px;color:var(--soft);margin:6px 0 0}
.attn{background:var(--attnBg);border:1px solid var(--attnLine);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.attn b{color:var(--red)}
.attn button{margin-left:auto;background:var(--ink);color:var(--onInk);border:0;border-radius:8px;padding:8px 14px;min-height:38px}
.grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.sum h3{display:flex;align-items:center;gap:7px}
.sum h3 i{width:10px;height:10px;border-radius:3px;display:inline-block}
.sum p{margin:0;font-size:14px}
/* platform tiles */
.plats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.pt{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pt .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.pt .name{font-size:13px;color:var(--soft);display:flex;align-items:center;gap:6px}
.pt .ch{font-size:13px;font-weight:600}
.up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--soft)}
/* post rows */
.list{display:flex;flex-direction:column;gap:6px}
.day{font-size:13px;font-weight:700;color:var(--soft);margin:14px 0 2px;text-transform:none}
.day:first-child{margin-top:0}
.prow{display:grid;grid-template-columns:6px minmax(0,1fr) 92px 84px 84px;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px 8px 0;cursor:pointer;text-align:left;width:100%}
.prow:hover{border-color:var(--soft)}
.prow .bar{align-self:stretch;border-radius:10px 0 0 10px}
.prow .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .s{font-size:13px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .v{text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.prow .v small{display:block;color:var(--soft);font-size:11px}
.colhead{display:grid;grid-template-columns:6px minmax(0,1fr) 92px 84px 84px;gap:12px;padding:0 12px 0 0;font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.04em}
.colhead span:nth-child(n+3){text-align:right}
.pill{display:inline-block;min-width:64px;text-align:center;border-radius:7px;padding:3px 8px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;background:var(--midBg)}
.pill.hi{background:var(--hiBg);color:var(--green)}
.pill.lo{background:var(--loBg);color:var(--red)}
.pill.na{background:transparent;color:var(--soft);font-weight:400}
.cell{text-align:right}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:1px 7px;margin:2px 4px 2px 0;background:var(--tagBg);color:var(--soft)}
.tag.final{color:var(--green)}
.tag.prov{color:var(--amber)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input,.filters select{width:auto}
input,select,textarea{font:inherit;font-size:15px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--input);color:var(--ink)}
#q{min-width:220px}
/* tables */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{font-size:12px;font-weight:600;color:var(--soft);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
td a{color:var(--bp)}
.dim{color:var(--soft)}
/* group bars */
.gbars{display:flex;flex-direction:column;gap:4px}
.gb{display:grid;grid-template-columns:minmax(120px,220px) 64px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:14px}
.gb .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gb .cnt{color:var(--soft);font-size:13px;text-align:right}
.gb .track{position:relative;height:18px;background:var(--line2);border-radius:5px}
.gb .track i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.gb .track b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.gb .val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.gb.off{opacity:.45}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--soft);margin-top:8px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.chart text{fill:var(--soft);font-size:11px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:12px}
/* prose */
.prose{max-width:78ch}
.prose p,.prose ul,.prose ol{margin:0 0 8px}
.prose ul,.prose ol{padding-left:22px}
.prose li{margin:3px 0}
.prose h4{font-size:15px;margin:14px 0 6px}
.prose code{font-size:13px;background:var(--tagBg);padding:0 4px;border-radius:4px}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px}
details.sec>summary{cursor:pointer;font-weight:600;font-size:15px}
details.sec[open]>summary{margin-bottom:8px}
/* your call */
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.q .ask{font-weight:700;font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.q .why{font-size:14px;color:var(--soft);margin:4px 0 10px;max-width:78ch}
.q .eff{font-size:13px;color:var(--soft);margin-top:10px;display:grid;gap:2px}
.q .eff b{color:var(--ink);font-weight:600}
.carried{font-size:11px;font-weight:700;color:var(--red);border:1px solid var(--attnLine);background:var(--attnBg);border-radius:10px;padding:1px 8px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:9px;padding:9px 14px;min-height:42px;text-align:left}
.opt[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--onInk)}
.veto{display:flex;flex-direction:column}
.veto .vr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line2)}
.veto .vr:first-child{border-top:0}
.veto .gid{font-size:12px;color:var(--soft)}
.vbtn{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:6px 14px;min-height:36px}
.vbtn[aria-pressed=true]{border-color:var(--red);color:var(--red);background:var(--loBg)}
textarea{width:100%;min-height:90px;resize:vertical}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.nums label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--soft)}
.locked .opt,.locked .vbtn{pointer-events:none}
.locked .opt[aria-pressed=false],.locked .vbtn[aria-pressed=false]{opacity:.45}
.submit{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.go{background:var(--green);color:#fff;border:1px solid var(--green);border-radius:8px;padding:9px 18px;min-height:42px;font-weight:600}
.go[disabled]{opacity:.5;cursor:default}
.plain{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 16px;min-height:42px}
.ok{color:var(--green);font-weight:600}
.bad{color:var(--red)}
/* sheet */
.sheetbg{position:fixed;inset:0;background:rgba(20,18,15,.35);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheetbg{align-items:center}.sheet{border-radius:14px}}
.sheet h3{font-size:18px;margin:0 0 4px}
.sheet .meta{color:var(--soft);font-size:13px;margin-bottom:10px}
.big{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.big>div{background:var(--bg);border-radius:10px;padding:8px 14px;min-width:120px}
.big small{display:block;color:var(--soft);font-size:12px}
.big b{font-size:22px;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.btns button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:38px}
.menu{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.menu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:50px}
.menu .mi{width:22px;text-align:center;font-size:17px}
.menu .ms{margin-left:auto;color:var(--soft);font-size:13px}
.foot{color:var(--soft);font-size:12px;margin-top:24px}
@media(max-width:640px){
  .prow,.colhead{grid-template-columns:6px minmax(0,1fr) 72px 72px}
  .prow .vw,.colhead .vw{display:none}
  .pill{min-width:54px}
  .gb{grid-template-columns:minmax(90px,140px) 40px minmax(0,1fr) 52px}
  .two{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top">
  <div class="titlebar"><h1>Scoreboard</h1><span id="meta"></span></div>
  <div class="controls">
    <div class="seg" id="tabs" role="tablist">
      <button data-v="week">This week</button><button data-v="posts">Posts</button><button data-v="trends">Trends</button><button data-v="playbook">Playbook</button><button data-v="yourcall" id="ycTab">Your Call</button>
    </div>
    <span class="spacer"></span>
    <button id="menuBtn" aria-label="Menu">☰ Menu</button>
  </div>
</header>
<div id="status" class="status"></div>
<main>
  <section id="v-week"></section>
  <section id="v-posts" hidden></section>
  <section id="v-trends" hidden></section>
  <section id="v-playbook" hidden></section>
  <section id="v-yourcall" hidden></section>
  <p class="foot">Rebuilt every Tuesday night by the analytics review. This page only reads the numbers; your Your Call answers are the one thing it saves, and the Wednesday research run reads them.</p>
</main>
<div id="sheetBg" class="sheetbg" hidden><div id="sheet" class="sheet" role="dialog" aria-modal="true"></div></div>

<script>
const DATA = /*SCOREBOARD_DATA*/null;
(function(){
"use strict";
const D = DATA || { posts: [], groups: {}, weekly_views: [], baselines: [], reviews: [], snapshots: [], playbook: "", latest_review: "", unmatched: [], tag_problems: [], reach_report: [], first_review: "2026-10-28", rules: {} };
D.posts = D.posts || []; D.groups = D.groups || {}; D.weekly_views = D.weekly_views || []; D.baselines = D.baselines || []; D.reach_report = D.reach_report || []; D.reviews = D.reviews || [];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const toD = s => new Date(String(s).slice(0, 10) + "T12:00:00");
const fmtDate = s => { if (!s) return ""; const d = toD(s); return WD[d.getDay()] + " " + d.getDate() + " " + MON[d.getMonth()]; };
const fmtShort = s => { if (!s) return ""; const d = toD(s); return d.getDate() + " " + MON[d.getMonth()]; };
const blank = v => v == null || v === "";
const n0 = v => blank(v) ? 0 : Number(v) || 0;
const big = v => blank(v) ? "·" : Number(v).toLocaleString("en-US");
const lift = v => blank(v) ? "·" : Number(v).toFixed(Number(v) >= 10 ? 0 : 1) + "×";
const lv = v => blank(v) ? "na" : v >= 1.25 ? "hi" : v <= 0.8 ? "lo" : "";
const pill = v => `<span class="pill ${lv(v)}" ${blank(v) ? 'title="Not scored yet"' : ""}>${blank(v) ? "·" : lift(v)}</span>`;
const SERIES = { "Battle Lines": "var(--bl)", "Home Front": "var(--hf)", "Blueprint": "var(--bp)", "Statecraft": "var(--sc)", "Flash": "var(--fl)" };
const colorOf = p => p.kind === "Name This" ? "var(--nt)" : (SERIES[p.series] || "var(--soft)");
const PLATS = ["Threads", "YouTube", "TikTok", "Instagram", "Facebook", "X"];
const PCOL = { Threads: "#24221f", YouTube: "#c0392b", TikTok: "#3D5884", Instagram: "#B8862B", Facebook: "#3f8a9a", X: "#8a8478" };
const SLOTORD = s => { const m = { "6:30 a.m.": 1, "8 a.m.": 2, "10 a.m.": 3, "Noon": 4, "2:30 p.m.": 5, "5 p.m.": 6, "7 p.m.": 7 }; return m[s] || 9; };
const status = t => { $("status").textContent = t || ""; if (t) setTimeout(() => { if ($("status").textContent === t) $("status").textContent = ""; }, 3000); };

/* theme, same switch as the Planning Board's menu */
let theme = "light";
try { theme = localStorage.getItem("sb_theme") || localStorage.getItem("pb_theme") || "light"; } catch (e) {}
function applyTheme(t) { theme = t === "dark" ? "dark" : "light"; document.documentElement.setAttribute("data-theme", theme); try { localStorage.setItem("sb_theme", theme); } catch (e) {} }
applyTheme(theme);

/* tiny markdown for the review, playbook and summary text */
function inline(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>").replace(/`(.+?)`/g, "<code>$1</code>"); }
function md(text) {
  const out = []; let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of String(text || "").split("\n")) {
    const line = raw.trimEnd(); let m;
    if (!line.trim()) { close(); continue; }
    if (/^#\s/.test(line)) { close(); continue; }
    if ((m = line.match(/^#{2,}\s+(.*)/))) { close(); out.push(`<h4>${inline(m[1])}</h4>`); continue; }
    if ((m = line.match(/^\s*[*-]\s+(.*)/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    if ((m = line.match(/^\s*\d+\.\s+(.*)/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    if (/^\|/.test(line)) { close(); if (/^\|[\s|:-]+\|$/.test(line)) continue; out.push(`<p><code>${esc(line)}</code></p>`); continue; }
    close(); out.push(`<p>${inline(line)}</p>`);
  }
  close(); return out.join("");
}
function sections(text) {
  const parts = []; let cur = null;
  for (const line of String(text || "").split("\n")) {
    const m = line.match(/^##\s+(.*)/);
    if (m) { cur = { title: m[1].trim(), body: [] }; parts.push(cur); }
    else if (cur) cur.body.push(line);
    else { if (!parts.intro) parts.intro = []; parts.intro.push(line); }
  }
  return parts;
}
function totalViews(p) { return (p.platforms || []).reduce((a, q) => a + n0(q.views), 0); }
function postLabel(p) { return [p.num ? "No. " + p.num : "", p.kind === "Name This" ? "Name This" : p.format, p.kind === "Name This" ? "" : p.series].filter(Boolean).join(" · "); }

/* ---------- post row and detail ---------- */
function postRow(p) {
  return `<button class="prow" data-post="${esc(p.id)}"><span class="bar" style="background:${colorOf(p)}"></span>
    <span style="min-width:0"><div class="t">${esc(p.title)}</div><div class="s">${esc(p.slot)} · ${esc(p.kind)} · ${esc(postLabel(p))}${p.status !== "final" ? " · " + esc(p.status) : ""}</div></span>
    <span class="v vw">${big(totalViews(p))}<small>views</small></span>
    <span class="cell">${pill(p.reach)}</span><span class="cell">${pill(p.response)}</span></button>`;
}
const COLHEAD = `<div class="colhead"><span></span><span>Post</span><span class="vw">Views</span><span>Reach</span><span>Response</span></div>`;
const byId = {}; D.posts.forEach(p => byId[p.id] = p);
function openPost(id) {
  const p = byId[id]; if (!p) return;
  const rows = (p.platforms || []).slice().sort((a, b) => n0(b.views) - n0(a.views)).map(q => `<tr>
    <td>${q.link ? `<a href="${esc(q.link)}" target="_blank" rel="noopener">${esc(q.platform)}</a>` : esc(q.platform)}</td>
    <td class="num">${big(q.views)}</td><td class="num">${blank(q.likes) ? "·" : q.likes}</td><td class="num">${blank(q.comments) ? "·" : q.comments}</td>
    <td class="num">${pill(q.reach_lift)}</td><td class="num">${pill(q.response_lift)}</td><td class="num">${blank(q.hold_pct) ? "·" : q.hold_pct + "%"}</td>
    <td class="dim">${q.counts === "yes" ? "counts" : "not yet"}</td></tr>`).join("");
  const t = p.themes || {}, tags = [];
  const add = (lab, v) => { (Array.isArray(v) ? v : v ? [v] : []).forEach(x => tags.push(`<span class="tag">${esc(lab ? lab + ": " + x : x)}</span>`)); };
  add("", t.who); add("", t.story); add("photo", t.photo); add("", t.theater); add("", t.nations); add("", t.branch);
  if (t.video) { add("opens on", t.video.opening); add("sound", t.video.sound); }
  if (p.question) tags.push(`<span class="tag">asks a question</span>`);
  openSheet(`<h3>${esc(p.title)}</h3>
    <div class="meta">${esc(fmtDate(p.date))} · ${esc(p.slot)} · ${esc(p.kind)} · ${esc(postLabel(p))} <span class="tag ${p.status === "final" ? "final" : "prov"}">${esc(p.status)}</span></div>

    <div class="scroll"><table><thead><tr><th>Platform</th><th class="num">Views</th><th class="num">Likes</th><th class="num">Comments</th><th class="num">Reach</th><th class="num">Response</th><th class="num">Hold</th><th>Scored</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="help">Reach and Response compare this post with a typical post of the same kind on the same platform: 1.0× is typical, 2.0× is double. "Not yet" means that platform is still under ${esc(D.rules.floor || 50)} typical views, so it is shown but not scored.</p>

/* ---------- This week ---------- */
const GEN = D.generated ? toD(D.generated) : new Date();
function partialWeek(ws) { return toD(ws).getTime() + 7 * 864e5 > GEN.getTime() + 12 * 36e5; }
function weekRows() {
  const w = D.weekly_views.slice().sort((a, b) => a.week < b.week ? -1 : 1);
  return w;
}
function renderWeek() {
  const el = $("v-week"), C = D.checkin, scored = D.posts.filter(p => !blank(p.reach)), h = [];
  if (!D.latest_review && !scored.length) {
    el.innerHTML = `<div class="box"><h3>First review ${esc(fmtDate(D.first_review))}</h3><p class="help">Every Tuesday night this page fills in with the week's best and weakest posts, what changed, and anything that needs your decision.</p></div>`;
    return;
  }
  const open = ycOpenCount();
  if (C && C.questions && open) h.push(`<div class="attn"><span><b>${open} ${open === 1 ? "question needs" : "questions need"} your call</b> for the week of ${esc(fmtShort(C.week))}. The Wednesday research run reads your answers.</span><button data-go="yourcall">Answer now</button></div>`);
  /* summary tiles */
  if (C && C.summary) {
    const tiles = [], colors = { "Worked": "var(--green)", "Didn't": "var(--red)", "Tests": "var(--bp)", "Decisions": "var(--amber)" };
    C.summary.split(/\n\s*\n/).forEach(par => { const m = par.match(/^\*\*(.+?):?\*\*:?\s*([\s\S]*)/); if (m) tiles.push({ k: m[1].replace(/:$/, ""), v: m[2] }); else tiles.push({ k: "Note", v: par }); });
    h.push(`<h2>Week of ${esc(fmtShort(C.week))} in brief</h2><div class="grid4">${tiles.map(t => `<div class="box sum"><h3><i style="background:${colors[t.k] || "var(--soft)"}"></i>${esc(t.k)}</h3><p>${inline(t.v)}</p></div>`).join("")}</div>`);
  }
  /* platform tiles, last full week vs the one before */
  const w = weekRows();
  if (w.length) {
    const lastFull = w.filter(x => !partialWeek(x.week));
    const cur = lastFull[lastFull.length - 1] || w[w.length - 1], prev = lastFull[lastFull.length - 2];
    const tiles = PLATS.filter(k => w.some(x => x[k])).map(k => {
      const a = n0(cur[k]), b = prev ? n0(prev[k]) : 0, ch = b ? a / b - 1 : null;
      const cls = ch == null ? "flat" : ch > 0.05 ? "up" : ch < -0.05 ? "down" : "flat";
      return `<div class="pt"><div class="name"><i class="dot" style="width:9px;height:9px;border-radius:3px;background:${PCOL[k]};display:inline-block"></i>${k}</div><div class="n">${big(a)}</div><div class="ch ${cls}">${ch == null ? "first week" : (ch > 0 ? "▲ " : ch < 0 ? "▼ " : "") + Math.abs(Math.round(ch * 100)) + "% vs week before"}</div></div>`;
    });
    h.push(`<h2>Views, week of ${esc(fmtShort(cur.week))}</h2><div class="plats">${tiles.join("")}</div><p class="help">Sunday to Saturday, by the day each post went out. Buffer trails the apps by up to a day.</p>`);
  }
  /* best and weakest of the last 7 days of scored posts */
  const newest = scored.reduce((m, p) => p.date > m ? p.date : m, "");
  const cut = newest ? new Date(toD(newest).getTime() - 7 * 864e5).toISOString().slice(0, 10) : "";
  const recent = scored.filter(p => p.date > cut).sort((a, b) => b.reach - a.reach);
  const best = recent.slice(0, 4), weak = recent.slice(-4).reverse().filter(p => !best.includes(p));
  h.push(`<div class="two"><div><h2>Best this week</h2>${COLHEAD}<div class="list">${best.map(postRow).join("") || '<p class="help">No scored posts yet.</p>'}</div></div>
    <div><h2>Weakest this week</h2>${COLHEAD}<div class="list">${weak.map(postRow).join("") || '<p class="help">Nothing yet.</p>'}</div></div></div>`);
  if (D.latest_review) h.push(`<h2>The full review</h2><details class="sec"><summary>Read the ${esc(fmtDate(D.reviews[D.reviews.length - 1]))} review</summary><div class="prose">${md(D.latest_review)}</div></details>`);
  el.innerHTML = h.join("");
}

/* ---------- Trends ---------- */
let gKind = "Card", gGroup = "Series";
const hidePlat = {};
function chart(all) {
  const weeks = all.filter(w => !partialWeek(w.week));
  const plats = PLATS.filter(k => weeks.some(w => w[k]));
  if (!weeks.length || !plats.length) return '<p class="help">The chart starts after the first review.</p>';
  const shown = plats.filter(k => !hidePlat[k]);
  const W = 760, H = 240, L = 48, R = 14, T = 12, B = 28;
  const max = Math.max(...weeks.flatMap(w => shown.map(k => n0(w[k]))), 1);
  const step = Math.pow(10, Math.floor(Math.log10(max))); const top = Math.ceil(max / step) * step;
  const x = i => weeks.length === 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (weeks.length - 1);
  const y = v => T + (H - T - B) * (1 - v / top);
  const col = k => k === "Threads" ? "var(--ink)" : PCOL[k];
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Views per week by platform">`;
  for (let g = 0; g <= 4; g++) { const v = top * g / 4; s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v >= 1000 ? (v / 1000) + "k" : v}</text>`; }
  weeks.forEach((w, i) => s += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${fmtShort(w.week)}</text>`);
  shown.forEach(k => { s += `<polyline points="${weeks.map((w, i) => x(i) + "," + y(n0(w[k]))).join(" ")}" fill="none" stroke="${col(k)}" stroke-width="2.5"/>`; weeks.forEach((w, i) => s += `<circle cx="${x(i)}" cy="${y(n0(w[k]))}" r="3" fill="${col(k)}"><title>${k}, week of ${fmtShort(w.week)}: ${big(w[k] || 0)}</title></circle>`); });
  return s + "</svg>" + `<div class="legend" id="pLegend">${plats.map(k => `<button data-plat="${k}" class="${hidePlat[k] ? "offp" : ""}"><i style="background:${col(k)}"></i>${k}</button>`).join("")}<span>Tap a platform to hide or show it. Full weeks only.</span></div>`;
}
function weekTable(weeks) {
  const plats = PLATS.filter(k => weeks.some(w => w[k])), ws = weeks.slice(-5);
  return `<div class="scroll" style="margin-top:12px"><table><thead><tr><th>Platform</th>${ws.map(w => `<th class="num">Week of ${esc(fmtShort(w.week))}${partialWeek(w.week) ? " (so far)" : ""}</th>`).join("")}</tr></thead><tbody>${plats.map(k => `<tr><td>${k}</td>${ws.map(w => `<td class="num">${big(w[k] || 0)}</td>`).join("")}</tr>`).join("")}
    <tr><td><b>All</b></td>${ws.map(w => `<td class="num"><b>${big(plats.reduce((a, k) => a + n0(w[k]), 0))}</b></td>`).join("")}</tr></tbody></table></div>`;
}

  const sorted = rows.slice().sort((a, b) => (b.usable - a.usable) || (n0(b.reach) - n0(a.reach)));
  return `<div class="gbars">${sorted.map(r => { const v = blank(r.reach) ? 0 : r.reach, c = !r.usable ? "var(--soft)" : v >= 1.25 ? "var(--green)" : v <= 0.8 ? "var(--red)" : "var(--amber)";
    return `<div class="gb ${r.usable ? "" : "off"}" title="${esc(r.usable ? "" : "Fewer than 5 posts, not enough data yet")}"><span class="lab">${esc(r.value)}</span><span class="cnt">${r.posts} ${r.posts === 1 ? "post" : "posts"}</span>
      <span class="track"><i style="width:${Math.min(100, v / mx * 100)}%;background:${c}"></i><b style="left:${100 / mx}%"></b></span><span class="val">${r.usable ? lift(r.reach) : "·"}</span></div>`; }).join("")}</div>
    <p class="help">Bars show average Reach. The dark line is 1.0×, a typical post. Faded rows have fewer than 5 posts, so they don't count yet.</p>`;
}
function renderTrends() {
  const el = $("v-trends"), w = weekRows();

  if (!groupsFor(gKind).includes(gGroup)) gGroup = groupsFor(gKind)[0] || "Series";
  const rr = D.reach_report.filter(r => r.after && r.after.posts > 0);
  const pct = v => blank(v) ? "·" : `<span class="${v > 0 ? "up" : v < 0 ? "down" : "flat"}">${v > 0 ? "+" : ""}${Math.round(v * 100)}%</span>`;

      <div class="box"><h3>Typical post, last ${esc(D.rules.window_days || 28)} days</h3><div class="scroll"><table><thead><tr><th>Kind</th><th>Platform</th><th class="num">Views</th><th class="num">Posts</th><th>Scored</th></tr></thead><tbody>${base.map(b => `<tr><td>${esc({ card: "Cards", video: "Videos", namethis: "Name This" }[b.kind] || b.kind)}</td><td>${esc(b.platform)}</td><td class="num">${big(Math.round(b.typical_views))}</td><td class="num">${b.posts}</td><td class="${b.counts ? "" : "dim"}">${b.counts ? "counts" : "not yet"}</td></tr>`).join("")}</tbody></table></div>
        <p class="help">A platform starts counting once its typical post reaches ${esc(D.rules.floor || 50)} views over ${esc(D.rules.min_posts || 5)} or more posts.</p></div>
    </div>`;
  $("gKind").onclick = e => { const b = e.target.closest("button"); if (b) { gKind = b.dataset.k; renderTrends(); } };
  $("gGroup").onchange = e => { gGroup = e.target.value; renderTrends(); };
  $("pLegend") && ($("pLegend").onclick = e => { const b = e.target.closest("[data-plat]"); if (b) { hidePlat[b.dataset.plat] = !hidePlat[b.dataset.plat]; renderTrends(); } });
}

/* ---------- Your Call ----------

const yc = { db: null, ready: false, saved: null, draft: {}, locked: false };
function ycAnswered(q, a) { const v = a && a[q.id]; if (v == null) return false; if (q.type === "veto") return true; if (q.type === "numbers") return Object.keys(v).length > 0; return String(v).trim() !== ""; }

function ycPaintTab() {
  const C = D.checkin, b = $("ycTab");

}

function ycCollect() {

  const v = e.target.closest(".vbtn");
  if (v) { const id = v.dataset.q, list = Array.isArray(yc.draft[id]) ? yc.draft[id] : (yc.draft[id] = []); const i = list.indexOf(v.dataset.gid); if (i < 0) list.push(v.dataset.gid); else list.splice(i, 1); const on = i < 0; v.setAttribute("aria-pressed", on); v.textContent = on ? "Vetoed" : "Veto"; return; }
  if (e.target.closest("#ycEdit")) { yc.locked = false; renderYourCall(); $("ycStatus").textContent = "Changing answers. Submit again when done."; return; }
  if (e.target.closest("#ycSubmit")) {
    const st = $("ycStatus"), btn = $("ycSubmit");
    if (!yc.db) { st.className = "bad"; st.textContent = "Not connected, nothing saved. Tell Claude in the Project instead."; return; }
    btn.disabled = true; st.className = ""; st.textContent = "Saving…";
    const body = { week: D.checkin.week, submitted: new Date().toISOString(), answers: ycCollect() };
    try { await yc.db.doc("answers/" + D.checkin.week).set(body); yc.saved = body; yc.draft = JSON.parse(JSON.stringify(body.answers)); yc.locked = true; renderYourCall(); renderWeek(); status("Answers saved."); }
    catch (err) { btn.disabled = false; st.className = "bad"; st.textContent = err && err.code === "invalid_argument" ? "This view can't save answers (open it as the owner). Nothing saved." : "That didn't save. Try again in a moment."; }
  }
});
$("v-yourcall").addEventListener("input", e => { const t = e.target; if (t.matches("textarea[data-q]")) yc.draft[t.dataset.q] = t.value; });
async function ycInit() {
  renderYourCall();
  const C = D.checkin; if (!C || !C.questions) return;
  try { yc.db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { yc.db = null; }
  yc.ready = true;
  if (yc.db) { try { const s = await yc.db.doc("answers/" + C.week).get(); if (s.exists) { yc.saved = s.data(); yc.draft = JSON.parse(JSON.stringify(yc.saved.answers || {})); yc.locked = true; } } catch (e) {} }
  renderYourCall(); renderWeek();
}

/* ---------- sheet and menu ---------- */
const sheetBg = $("sheetBg"), sheet = $("sheet");
function openSheet(html) { sheet.innerHTML = html; sheetBg.hidden = false; sheet.scrollTop = 0; }
function closeSheet() { sheetBg.hidden = true; sheet.innerHTML = ""; }
sheetBg.addEventListener("click", e => { if (e.target === sheetBg || e.target.closest("[data-close]")) closeSheet(); const m = e.target.closest("[data-menu]"); if (m) MENU[+m.dataset.menu].run(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
function summaryText() {
  const C = D.checkin, out = ["WW2 Dispatches Scoreboard" + (C ? ", week of " + fmtShort(C.week) : "")];
  if (C && C.summary) out.push("", C.summary.replace(/\*\*/g, ""));
  return out.join("\n");
}
const MENU = [
  { icon: "🌙", label: "Dark mode", state: () => theme === "dark" ? "On" : "Off", run: () => { applyTheme(theme === "dark" ? "light" : "dark"); openMenu(); } },
  { icon: "📋", label: "Copy the week's summary", run: async () => { try { await navigator.clipboard.writeText(summaryText()); closeSheet(); status("Summary copied."); } catch (e) { openSheet(`<h3>Copy the summary</h3><textarea style="min-height:220px">${esc(summaryText())}</textarea><div class="btns"><button data-close>Close</button></div>`); } } },
  { icon: "❔", label: "How the scores work", run: () => openSheet(`<h3>How the scores work</h3><div class="prose">
    <p><b>Reach</b> compares a post's views with a typical post of the same kind (card, video, or Name This) on the same platform, over the last ${esc(D.rules.window_days || 28)} days. 1.0× is typical, 2.0× is double, 0.5× is half.</p>
    <p><b>Response</b> is reactions per 100 views (${esc(D.rules.weights || "like 1, comment 3, repost, quote, share, or save 2")}), compared the same way. Only posts with 50 or more views get one.</p>
    <p><span class="pill hi">1.3×</span> green is 1.25× or better. <span class="pill lo">0.7×</span> red is 0.8× or lower. Anything between is about typical.</p>
    <p>Posts under 48 hours old are too early. From 48 hours a score is provisional, and from 7 days it is final. A platform counts once its typical post reaches ${esc(D.rules.floor || 50)} views over ${esc(D.rules.min_posts || 5)} posts.</p></div><div class="btns"><button data-close>Close</button></div>`) }
];
function openMenu() { openSheet(`<h3>Menu</h3><div class="menu">${MENU.map((m, i) => `<button data-menu="${i}"><span class="mi">${m.icon}</span><span>${esc(m.label)}</span>${m.state ? `<span class="ms">${esc(m.state())}</span>` : ""}</button>`).join("")}</div><div class="btns"><button data-close>Close</button></div>`); }
$("menuBtn").onclick = openMenu;

/* ---------- tabs ---------- */
const VIEWS = ["week", "posts", "trends", "playbook", "yourcall"];
function show(v) {
  if (!VIEWS.includes(v)) v = "week";
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  VIEWS.forEach(x => $("v-" + x).hidden = x !== v);
  try { localStorage.setItem("scoreboard-view", v); } catch (e) {}
  window.scrollTo(0, 0);
}
$("tabs").onclick = e => { const b = e.target.closest("button"); if (b) show(b.dataset.v); };
document.addEventListener("click", e => { const p = e.target.closest("[data-post]"); if (p) openPost(p.dataset.post); const g = e.target.closest("[data-go]"); if (g) show(g.dataset.go); });

$("meta").textContent = D.generated ? `Updated ${fmtDate(D.generated)} · ${D.snapshots.length} weekly ${D.snapshots.length === 1 ? "pull" : "pulls"} · ${D.posts.length} posts` : `First review ${fmtDate(D.first_review)}`;
renderWeek(); renderPosts(); renderTrends(); renderPlaybook(); ycInit();
let start = location.hash.slice(1);
if (!VIEWS.includes(start)) { try { start = localStorage.getItem("scoreboard-view") || "week"; } catch (e) { start = "week"; } }
show(start);
})();
</script>
</body>
