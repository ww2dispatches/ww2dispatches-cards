<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WW2 Dispatches</title>
<meta name="description" content="World War II, one day at a time. Battles, inventions, politics, and people.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root { --paper:#EDE4CF; --ink:#1A1612; --red:#B04A3E; --navy:#3D5884; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
         font-family:"Oswald",sans-serif; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  main { width:100%; max-width:440px; text-align:center; }
  .badge { width:104px; height:104px; border-radius:50%; background:var(--red); color:var(--paper);
           display:flex; align-items:center; justify-content:center; margin:0 auto 16px;
           font-weight:700; font-size:40px; box-shadow:inset 0 0 0 5px var(--red), inset 0 0 0 8px var(--paper); }
  h1 { font-size:32px; margin:0; letter-spacing:.5px; }
  p { font-family:"Special Elite",monospace; color:var(--navy); margin:8px 0 28px; }
  a.btn { display:block; padding:16px; margin:12px 0; background:var(--ink); color:var(--paper);
          text-decoration:none; font-size:18px; letter-spacing:1px; text-transform:uppercase; border-radius:6px; }
  a.btn:hover { background:var(--red); }
  .note { font-size:13px; color:var(--navy); margin-top:28px; font-family:"Special Elite",monospace; }
</style>
</head>
<body>
<main>
  <div class="badge">WW2</div>
  <h1>WW2 Dispatches</h1>
  <p>World War II, one day at a time.</p>
  <a class="btn" href="https://ww2dispatches.substack.com/subscribe">Get the Weekly Dispatch</a>
  <a class="btn" href="https://ko-fi.com/ww2dispatches">Support WW2 Dispatches</a>
  <a class="btn" href="mailto:contact@ww2dispatches.com">Contact</a>
  <div class="note">Placeholder page. The full design is coming soon.</div>
</main>
</body>
</html>
