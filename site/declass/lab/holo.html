<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Declass holo lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Special+Elite&display=swap">
<link rel="stylesheet" href="/declass/declass.css">
<style>
/* Holo lab (31 Oct 2026): compare finish overlays on a real phone with real tilt. Not linked from the game. */
body{margin:0}
.lab{max-width:420px;margin:0 auto;padding:14px 16px 40px}
.lab h1{font-size:26px;margin:4px 0 2px;text-align:center}
.lab .sub{text-align:center;margin:0 0 12px}
.seg{display:flex;gap:6px;margin:8px 0}
.seg button{flex:1;font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;padding:9px 4px;border-radius:3px;border:2px solid #7a6b56;background:transparent;color:#d8cdb6;cursor:pointer}
.seg button.on{border-color:#e3c25e;color:#1a1612;background:#e3c25e}
.desc{font-family:var(--type);font-size:14px;color:#cbbf9f;min-height:42px;margin:6px 2px 12px;line-height:1.4}
.desc b{font-family:var(--display);color:#EDE4CF;letter-spacing:.06em;text-transform:uppercase}
.stagel{width:min(86vw,340px);margin:0 auto;touch-action:none}
.tiltbtn{display:block;margin:14px auto 0;font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;padding:11px 18px;border-radius:3px;border:0;background:#B04A3E;color:#FFF8EA;cursor:pointer}
.tnote{text-align:center;font-family:var(--type);font-size:13px;color:#a89d88;margin:8px 0 0}

/* the light: --mx/--my 0..100%, --tx/--ty -1..1, set by script */
.cf .hl{position:absolute;inset:0;pointer-events:none;z-index:2;display:none}
.optB .cf .hl,.optC .cf .hl,.optD .cf .hl{display:block}
.optB .cf .sheen,.optC .cf .sheen,.optD .cf .sheen{display:none !important}
/* moving band: a tinted wash with a bright core that travels all the way across the card as you tilt */
.cf .hb{background:linear-gradient(112deg,transparent calc(var(--mx) - 26%),var(--bt) calc(var(--mx) - 9%),var(--bt) calc(var(--mx) + 9%),transparent calc(var(--mx) + 26%));mix-blend-mode:multiply}
.cf .hb::after{content:"";position:absolute;inset:0;background:linear-gradient(112deg,transparent calc(var(--mx) - 7%),rgba(255,255,255,.75) var(--mx),transparent calc(var(--mx) + 7%));mix-blend-mode:screen}
/* glare: a hot spot where the light lands */
.cf .hx{background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.55),rgba(255,255,255,.18) 20%,transparent 45%);mix-blend-mode:screen}
/* texture: only shows where the light is */
.cf .hg{display:none !important;-webkit-mask-image:radial-gradient(circle at var(--mx) var(--my),#000 0,rgba(0,0,0,.6) 32%,transparent 65%);mask-image:radial-gradient(circle at var(--mx) var(--my),#000 0,rgba(0,0,0,.6) 32%,transparent 65%)}
.optC .cf .hg,.optD .cf .hg{display:block !important}
.cf.f-silver{--bt:rgba(150,170,200,.38)}
.cf.f-gold{--bt:rgba(232,168,40,.42)}
.cf.f-topsecret{--bt:rgba(170,150,230,.30)}
/* silver: brushed metal lines */
.cf.f-silver .hg{background:repeating-linear-gradient(90deg,rgba(70,80,95,.22) 0 1px,rgba(255,255,255,.35) 1px 2px,transparent 2px 4px);mix-blend-mode:soft-light;opacity:1}
/* gold: glitter that catches the light */
.cf.f-gold .hg{background:
  radial-gradient(circle,#fff6c8 0 .7px,rgba(232,170,40,.95) 1px,transparent 1.8px) 0 0/10px 12px,
  radial-gradient(circle,#fffbe6 0 .6px,rgba(220,150,30,.9) 1px,transparent 1.7px) 5px 6px/15px 14px,
  radial-gradient(circle,#fff 0 .8px,rgba(255,200,80,.9) 1.1px,transparent 2px) 3px 2px/22px 19px;opacity:.9}
/* top secret: straight prism bands that slide with the tilt (no swirls) */
.cf.f-topsecret .hg{background:repeating-linear-gradient(115deg,hsl(0 100% 60%) 0,hsl(45 100% 55%) 3%,hsl(120 90% 50%) 6%,hsl(195 100% 55%) 9%,hsl(270 95% 62%) 12%,hsl(330 100% 60%) 15%,hsl(0 100% 60%) 18%);background-size:200% 200%;background-position:calc(50% + var(--tx) * 40%) calc(50% + var(--ty) * 40%);mix-blend-mode:color;opacity:.55;-webkit-mask-image:radial-gradient(ellipse 85% 75% at var(--mx) var(--my),#000 0,rgba(0,0,0,.55) 40%,transparent 78%);mask-image:radial-gradient(ellipse 85% 75% at var(--mx) var(--my),#000 0,rgba(0,0,0,.55) 40%,transparent 78%)}
/* D: stronger, and the frame itself shimmers */
.optD .cf{--bt2:1}.optD .cf .hb{opacity:1}.optD .cf.f-gold{--bt:rgba(232,160,30,.55)}.optD .cf.f-silver{--bt:rgba(140,165,205,.5)}
.optD .cf.f-topsecret .hg{opacity:.75}
.optD .cf.f-gold .hg{opacity:1}
.optD .cf .frame{background-size:240% 240% !important;background-position:var(--mx) var(--my) !important}
.optD .cf.f-silver .frame{background:linear-gradient(135deg,#6f757e,#d8dde3 30%,#8f959e 45%,#f2f4f7 55%,#8f959e 70%,#6f757e)}
.optD .cf.f-gold .frame{background:linear-gradient(135deg,#7f5a0e,#f0cf63 28%,#a8801f 44%,#fff0a8 54%,#a8801f 68%,#7f5a0e)}
.optD .cf.f-topsecret .frame::after{opacity:1;background-size:240% 240%;background-position:var(--mx) var(--my)}
.optD .cf .frame{box-shadow:0 0 34px var(--fglow,transparent),0 14px 34px rgba(0,0,0,.7) !important}
.optD .cf.f-gold{--fglow:rgba(240,200,90,.35)}.optD .cf.f-silver{--fglow:rgba(220,230,240,.22)}.optD .cf.f-topsecret{--fglow:rgba(170,200,255,.35)}

/* ===== E / F: the Pocket system (31 Oct 2026). Finger turns the card in 3D; foil on the border, matte photo (E) or a
   faint prism through the photo on Top Secret (F); twinkling stars; a glare that moves against the tilt. ===== */
.t3d{perspective:900px}
.optE .cf,.optF .cf{transform:rotateX(calc(var(--ry,0) * 1deg)) rotateY(calc(var(--rx,0) * 1deg));transform-style:preserve-3d;will-change:transform}
.optE .cf.rest,.optF .cf.rest{transition:transform 1.15s cubic-bezier(.22,1.25,.36,1)}
.optE .cf .sheen,.optF .cf .sheen,.optE .cf .hl,.optF .cf .hl{display:none !important}
.cf .pf,.cf .ps,.cf .ps2,.cf .pg,.cf .pp{position:absolute;inset:0;pointer-events:none;z-index:2;display:none}
.optE .cf .pf,.optF .cf .pf,.optE .cf .ps,.optF .cf .ps,.optE .cf .ps2,.optF .cf .ps2,.optE .cf .pg,.optF .cf .pg{display:block}
.optF .cf.f-topsecret .pp{display:block}
/* the cutout: everything but the photo box (3.2% in, 11.6% to 88.3% down), same on every card */
.cf .pf,.cf .ps,.cf .ps2{-webkit-mask:linear-gradient(#000 0 0),linear-gradient(#000 0 0) center/93.6% 76.7% no-repeat;-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0),linear-gradient(#000 0 0) center/93.6% 76.7% no-repeat;mask-composite:exclude}
/* foil: broad soft diagonal streaks that slide with the tilt, tinting the cream; a white glint rides on top */
.cf .pf{background:var(--streaks);background-size:260% 260%;background-position:calc(50% + var(--tx,0) * 45%) calc(50% + var(--ty,0) * 45%);mix-blend-mode:multiply;opacity:.95}
.cf .pf::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 0%,transparent calc(var(--gx,50%) - 18%),rgba(255,255,255,.55) calc(var(--gx,50%) - 3%),rgba(255,255,255,.85) var(--gx,50%),rgba(255,255,255,.55) calc(var(--gx,50%) + 3%),transparent calc(var(--gx,50%) + 18%));mix-blend-mode:screen}
.cf.f-silver{--streaks:repeating-linear-gradient(118deg,#dfe7f0 0,#aebfd6 6%,#f3f6fa 11%,#c9b8d8 16%,#dfe7f0 22%)}
.cf.f-gold{--streaks:repeating-linear-gradient(118deg,#f7e3a8 0,#e2a93a 6%,#fff3c9 11%,#f2b56a 16%,#f7e3a8 22%)}
.cf.f-topsecret{--streaks:repeating-linear-gradient(118deg,#ffd6e0 0,#fff2c4 4%,#d4f7dc 8%,#cfe6ff 12%,#e6d4ff 16%,#ffd6e0 20%)}
/* stars: two layers at different phases; each lights up where its window is, so they twinkle as the light passes */
/* ---- textures per finish (31 Oct 2026): Silver brushed metal with a few cool glints, Gold glitter, Top Secret stars and prism ---- */
.cf .ps,.cf .ps2{mix-blend-mode:screen;opacity:1}
/* the cutout for both texture layers, plus a light window that differs per finish */
.cf .ps{-webkit-mask:var(--winA),linear-gradient(#000 0 0) center/93.6% 76.7% no-repeat;-webkit-mask-composite:source-out;mask:var(--winA),linear-gradient(#000 0 0) center/93.6% 76.7% no-repeat;mask-composite:subtract}
.cf .ps2{-webkit-mask:var(--winB),linear-gradient(#000 0 0) center/93.6% 76.7% no-repeat;-webkit-mask-composite:source-out;mask:var(--winB),linear-gradient(#000 0 0) center/93.6% 76.7% no-repeat;mask-composite:subtract}
/* SILVER: brushed lines lit by a narrow sharp streak; sparse small cool glints */
.cf.f-silver .ps{background:repeating-linear-gradient(0deg,rgba(255,255,255,.55) 0 1px,rgba(60,70,90,.25) 1px 2px,transparent 2px 3px);--winA:linear-gradient(115deg,transparent calc(var(--gx,50%) - 14%),#000 calc(var(--gx,50%) - 2%),#000 calc(var(--gx,50%) + 2%),transparent calc(var(--gx,50%) + 14%))}
.cf.f-silver .ps2{background-image:var(--glint);background-size:96px 96px,131px 131px;background-position:11px 7px,53px 61px;opacity:.9;--winB:radial-gradient(circle at var(--sx,50%) var(--sy,50%),#000 0,rgba(0,0,0,.5) 10%,transparent 26%)}
/* GOLD: dense fine glitter that lights inside a broad warm window, two layers at different phases so it sparkles */
.cf.f-gold .ps{background:radial-gradient(circle,#fff8dc 0 .7px,rgba(255,215,120,.9) 1px,transparent 1.5px) 0 0/7px 7px,radial-gradient(circle,#ffe9a8 0 .6px,transparent 1.2px) 3px 4px/9px 9px;--winA:radial-gradient(ellipse 60% 50% at var(--sx,50%) var(--sy,50%),#000 0,rgba(0,0,0,.55) 30%,transparent 62%)}
.cf.f-gold .ps2{background:radial-gradient(circle,#fff 0 .8px,rgba(255,200,90,.9) 1.1px,transparent 1.7px) 2px 1px/11px 11px,radial-gradient(circle,#fff3c4 0 .6px,transparent 1.2px) 6px 7px/13px 13px;--winB:radial-gradient(ellipse 50% 42% at var(--sx2,50%) var(--sy2,50%),#000 0,rgba(0,0,0,.5) 28%,transparent 58%)}
/* TOP SECRET: the stars, big and bright, with a tinted halo; tiny prismatic dots between them */
.cf.f-topsecret .ps{background-image:var(--star);background-size:52px 52px,74px 74px,38px 38px;background-position:3px 5px,27px 39px,9px 2px;--winA:radial-gradient(circle at var(--sx,50%) var(--sy,50%),#000 0,rgba(0,0,0,.65) 16%,transparent 38%)}
.cf.f-topsecret .ps2{background:var(--star2),radial-gradient(circle,#ffd3e0 0 .7px,transparent 1.3px) 0 0/13px 13px,radial-gradient(circle,#cfe8ff 0 .7px,transparent 1.3px) 5px 7px/17px 17px,radial-gradient(circle,#fff6c4 0 .6px,transparent 1.2px) 9px 3px/11px 11px;background-size:64px 64px,13px 13px,17px 17px,11px 11px;background-position:31px 25px,0 0,5px 7px,9px 3px;--winB:radial-gradient(circle at var(--sx2,50%) var(--sy2,50%),#000 0,rgba(0,0,0,.6) 16%,transparent 40%)}
/* the thin inner rule on a Top Secret frame becomes a rainbow line that chases the light */
.optE .cf.f-topsecret .frame::before,.optF .cf.f-topsecret .frame::before{border:2px solid transparent;border-image:conic-gradient(from calc(var(--tx,0) * 200deg + var(--ty,0) * 120deg + 20deg),#ff7a7a,#ffe27a,#8dffb5,#7ac8ff,#d38bff,#ff7ad1,#ff7a7a) 1;box-shadow:none}
/* glare: an overhead light reflecting off the card, moving against the tilt, over the photo too */
/* glare per finish: Silver sharp and narrow, Gold broad and warm, Top Secret strongest */
.cf .pg{background:radial-gradient(ellipse var(--gw,55%) var(--gh,45%) at var(--gx2,50%) var(--gy2,50%),var(--gc,rgba(255,255,255,.55)),var(--gc2,rgba(255,255,255,.18)) 35%,transparent 70%);mix-blend-mode:screen}
.cf.f-silver .pg{--gw:38%;--gh:34%;--gc:rgba(235,242,255,.5);--gc2:rgba(235,242,255,.12)}
.cf.f-gold .pg{--gw:64%;--gh:52%;--gc:rgba(255,238,190,.6);--gc2:rgba(255,225,150,.2)}
.cf.f-topsecret .pg{--gw:62%;--gh:50%;--gc:rgba(255,255,255,.7);--gc2:rgba(255,255,255,.22)}
/* F: a faint prism through the photo on Top Secret (the "rainbow rare" treatment) */
.cf .pp{background:repeating-linear-gradient(115deg,hsl(0 100% 65%) 0,hsl(45 100% 60%) 4%,hsl(120 90% 55%) 8%,hsl(195 100% 60%) 12%,hsl(270 95% 65%) 16%,hsl(330 100% 65%) 20%,hsl(0 100% 65%) 24%);background-size:240% 240%;background-position:calc(50% + var(--tx,0) * 40%) calc(50% + var(--ty,0) * 40%);mix-blend-mode:color;opacity:.3;-webkit-mask:linear-gradient(#000 0 0) center/93.6% 76.7% no-repeat;mask:linear-gradient(#000 0 0) center/93.6% 76.7% no-repeat}
/* the metal frame catches the edge light as the card turns */
.optE .cf .frame,.optF .cf .frame{background-size:220% 220% !important;background-position:calc(50% - var(--tx,0) * 40%) calc(50% - var(--ty,0) * 40%) !important}
.optE .cf.f-topsecret .frame::after,.optF .cf.f-topsecret .frame::after{background-size:220% 220%;background-position:calc(50% + var(--tx,0) * 40%) calc(50% + var(--ty,0) * 40%);opacity:1}
.optE .cf .frame,.optF .cf .frame{box-shadow:0 0 30px var(--fglow,transparent),0 18px 40px rgba(0,0,0,.65) !important}
.optE .cf.f-gold,.optF .cf.f-gold{--fglow:rgba(240,200,90,.3)}.optE .cf.f-silver,.optF .cf.f-silver{--fglow:rgba(220,230,240,.18)}.optE .cf.f-topsecret,.optF .cf.f-topsecret{--fglow:rgba(170,200,255,.32)}
</style>
</head>
<body>
<div class="lab" id="lab">
  <h1>Holo lab</h1>
  <p class="sub">Drag a finger across the card, or tilt your phone.</p>
  <div class="seg" id="fin"><button data-f="silver">Silver</button><button data-f="gold" class="on">Gold</button><button data-f="topsecret">Top Secret</button></div>
  <div class="seg" id="opt"><button data-o="A">A</button><button data-o="B">B</button><button data-o="C" class="on">C</button><button data-o="D">D</button><button data-o="E">E</button><button data-o="F">F</button></div>
  <p class="desc" id="desc"></p>
  <div class="stagel" id="stage"></div>
  <button class="tiltbtn" id="reveal">Play reveal</button>
  <button class="tiltbtn" id="tilt" hidden>Turn on tilt</button>
  <p class="tnote" id="tnote"></p>
</div>
<script>
// a small four point star centered in a roomy tile, so tiles can be large and the stars sparse
const STAR = (c, r, h) => `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'><circle cx='30' cy='30' r='${r * .6}' fill='${h || c}' opacity='.4'/><path d='M30 ${30 - r} L${30 + r * .2} ${30 - r * .2} L${30 + r} 30 L${30 + r * .2} ${30 + r * .2} L30 ${30 + r} L${30 - r * .2} ${30 + r * .2} L${30 - r} 30 L${30 - r * .2} ${30 - r * .2} Z' fill='${c}'/></svg>`)}")`;
document.documentElement.style.setProperty('--star', [STAR('#fff', 12, '#ffd3e0'), STAR('#fff6d6', 8, '#cfe8ff'), STAR('#ffffff', 5, '#fff6c4')].join(','));
document.documentElement.style.setProperty('--star2', STAR('#ffffff', 9, '#e6d4ff'));
document.documentElement.style.setProperty('--glint', [STAR('#eaf2ff', 5, '#9fc4ff'), STAR('#ffffff', 4, '#b9d4ff')].join(','));
const IMG = 'https://cdn.jsdelivr.net/gh/ww2dispatches/ww2dispatches-cards@main/cards/dispatch-008-instagram.jpg';
const DESC = {
  A: '<b>A · Today.</b> What the game shows now: a mostly fixed shine on Silver, a gentle angle change on Gold, the rainbow wash on Top Secret.',
  B: '<b>B · Moving light.</b> A bright band travels all the way across the card as you tilt, with a soft hot spot where the light lands.',
  C: '<b>C · Foil.</b> B, plus a texture for each finish that only shows in the light: brushed metal on Silver, fine glitter on Gold, sliding prism bands on Top Secret.',
  D: '<b>D · Full holo.</b> C turned up, and the frame itself shimmers and glows as it catches the light.',
  E: '<b>E · Pocket.</b> Finger only, no phone tilt. Drag the card and it turns in 3D, springing back when you let go. Foil streaks slide across the frame and the paper, stars twinkle as the light passes, and a glare moves against the tilt. The photo stays matte.',
  F: '<b>F · Pocket, rainbow rare.</b> E, plus a faint prism running through the photo on Top Secret.'
};
let fin = 'gold', opt = 'E';
const $ = id => document.getElementById(id);
function render() {
  const serial = fin === 'topsecret' ? 'Worldwide serial 0001' : '';
  $('stage').innerHTML = `<div class="t3d"><div class="cf f-${fin}"><div class="frame"><div class="card"><img src="${IMG}" alt=""><span class="sheen"></span><span class="hl hb"></span><span class="hl hx"></span><span class="hl hg"></span><span class="pf"></span><span class="ps"></span><span class="ps2"></span><span class="pp"></span><span class="pg"></span><span class="badge">Top Secret</span></div><span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span><span class="serial">${serial}</span></div></div></div>`;
  wire3d();
  $('lab').className = 'lab opt' + opt;
  $('desc').innerHTML = DESC[opt];
  document.querySelectorAll('#fin button').forEach(b => b.classList.toggle('on', b.dataset.f === fin));
  document.querySelectorAll('#opt button').forEach(b => b.classList.toggle('on', b.dataset.o === opt));
}
document.querySelectorAll('#fin button').forEach(b => b.onclick = () => { fin = b.dataset.f; render(); });
document.querySelectorAll('#opt button').forEach(b => b.onclick = () => { opt = b.dataset.o; render(); });
render();

// the light, same mapping as the game (x, y in -0.5..0.5), plus the new variables
let touched = 0, t = 0;
function light(x, y, manual) {
  if (manual) touched = Date.now();
  const r = document.documentElement.style;
  r.setProperty('--ang', (135 + x * 60) + 'deg');
  r.setProperty('--ang2', (45 + y * 90) + 'deg');
  r.setProperty('--pos', (50 + x * 80) + '% ' + (50 + y * 80) + '%');
  r.setProperty('--gang', (118 + x * 50) + 'deg');
  r.setProperty('--mx', (50 + x * 150) + '%');
  r.setProperty('--my', (50 + y * 130) + '%');
  r.setProperty('--tx', (x * 2).toFixed(3));
  r.setProperty('--ty', (y * 2).toFixed(3));
}
// E/F: the finger turns the card; let go and it springs back. Tilt nudges it when nothing is touching.
let fingerDown = false;
function set3d(tx, ty, rest) {
  const r = document.documentElement.style, cf = document.querySelector('#stage .cf');
  if (cf) cf.classList.toggle('rest', Boolean(rest));
  r.setProperty('--tx', tx.toFixed(3)); r.setProperty('--ty', ty.toFixed(3));
  r.setProperty('--rx', (tx * 22).toFixed(2)); r.setProperty('--ry', (-ty * 22).toFixed(2));
  r.setProperty('--gx', (50 + tx * 70) + '%');
  r.setProperty('--gx2', (50 - tx * 45) + '%'); r.setProperty('--gy2', (50 - ty * 45) + '%');
  r.setProperty('--sx', (50 + tx * 60) + '%'); r.setProperty('--sy', (50 + ty * 60) + '%');
  r.setProperty('--sx2', (50 - tx * 50) + '%'); r.setProperty('--sy2', (30 - ty * 50) + '%');
}
function wire3d() {
  const cf = document.querySelector('#stage .cf'); if (!cf) return;
  const at = e => { const p = e.touches ? e.touches[0] : e, b = cf.getBoundingClientRect(); return [Math.max(-1, Math.min(1, ((p.clientX - b.left) / b.width - .5) * 2)), Math.max(-1, Math.min(1, ((p.clientY - b.top) / b.height - .5) * 2))]; };
  cf.addEventListener('pointerdown', e => { fingerDown = true; touched = Date.now(); const [x, y] = at(e); set3d(x, y, true); setTimeout(() => cf.classList.remove('rest'), 300); });
  cf.addEventListener('pointermove', e => { if (!fingerDown && e.pointerType !== 'mouse') return; touched = Date.now(); const [x, y] = at(e); set3d(x, y, false); });
  const up = () => { if (!fingerDown) return; fingerDown = false; touched = Date.now(); set3d(0, 0, true); };
  cf.addEventListener('pointerup', up); cf.addEventListener('pointercancel', up); cf.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') up(); });
  cf.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
}
// The reveal rock: the card turns on its own for a moment so the foil sweeps across, then settles.
let rocking = false;
function playReveal() {
  if (rocking) return; rocking = true; touched = Date.now() + 4000;
  const cf = document.querySelector('#stage .cf'); if (cf) cf.classList.remove('rest');
  const R = { silver: [1700, 0.55, 0.3, 0], gold: [2400, 0.85, 0.45, 0], topsecret: [3000, 1, 0.5, 1] }[fin] || [2400, 0.85, 0.45, 0];
  const t0 = performance.now(), D = R[0] + R[3] * 1100;
  const step = now => {
    const k = Math.min(1, (now - t0) / D);
    const k1 = Math.min(1, (now - t0) / R[0]), e = Math.sin(k1 * Math.PI); // the main swing swells then fades
    let tx = Math.sin(k1 * Math.PI * 2) * R[1] * e, ty = Math.sin(k1 * Math.PI + 0.6) * R[2] * e;
    if (R[3] && now - t0 > R[0]) { const k2 = (now - t0 - R[0]) / 1100, e2 = Math.sin(Math.min(1, k2) * Math.PI); tx = Math.sin(k2 * Math.PI * 2) * 0.35 * e2; ty = -Math.sin(k2 * Math.PI) * 0.2 * e2; } // the second, smaller sway
    set3d(tx, ty, false); light(tx / 2, ty / 2, true);

}
