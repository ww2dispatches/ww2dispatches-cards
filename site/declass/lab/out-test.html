<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Way out test</title>
<style>
body{font-family:system-ui,sans-serif;background:#16110e;color:#eee6d2;margin:0;padding:16px;font-size:17px;line-height:1.4}
h1{font-size:22px;margin:0 0 6px}p{margin:8px 0}
a.t,button.t{display:block;width:100%;box-sizing:border-box;margin:10px 0;padding:16px;font-size:18px;font-weight:700;text-align:left;background:#a34f44;color:#fff;border:0;border-radius:6px;text-decoration:none}
small{display:block;font-weight:400;font-size:13px;opacity:.85}
#ua{font-size:11px;opacity:.6;word-break:break-all;margin-top:18px}
</style></head><body>
<h1>Way out test</h1>
<p>Build 3. Tap each button once. After each tap, note whether another browser opened, a prompt appeared, or nothing happened. Come back here for the next one.</p>
<div id="b"></div>
<p id="ua"></p>
<script>
var dest = location.origin + '/declass/lab/out-test.html?landed=1';
var bare = dest.replace(/^https:\/\//, '');
if (/landed=1/.test(location.search)) document.body.insertAdjacentHTML('afterbegin', '<p style="background:#3d5a2a;padding:12px;border-radius:6px"><b>You landed here from a button.</b> If the address bar at the top or bottom is your normal browser, that button works.</p>');
var tests = [
  ['1', 'Safari link, plain tap', 'a', 'x-safari-' + dest],
  ['2', 'Safari link, by script', 'href', 'x-safari-' + dest],
  ['3', 'Safari link, new window', 'open', 'x-safari-' + dest],
  ['4', 'Ordinary link, new window', 'blank', dest],
  ['5', 'Chrome link', 'a', 'googlechromes://' + bare],
  ['6', 'Edge link', 'a', 'microsoft-edge-' + dest],
  ['7', 'Firefox link', 'a', 'firefox://open-url?url=' + encodeURIComponent(dest)],
  ['8', 'Older Safari link', 'a', 'com-apple-mobilesafari-tab:' + dest],
  ['9', 'Android link', 'a', 'intent://' + bare + '#Intent;scheme=https;S.browser_fallback_url=' + encodeURIComponent(dest) + ';end']
];
var box = document.getElementById('b');
tests.forEach(function (t) {
  var el;
  if (t[2] === 'a') { el = document.createElement('a'); el.href = t[3]; }
  else if (t[2] === 'blank') { el = document.createElement('a'); el.href = t[3]; el.target = '_blank'; el.rel = 'noopener'; }
  else { el = document.createElement('button'); el.type = 'button'; el.onclick = function () { if (t[2] === 'href') location.href = t[3]; else window.open(t[3], '_blank'); }; }
  el.className = 't';
  el.innerHTML = t[0] + '. ' + t[1] + '<small>' + t[3].slice(0, 38) + '…</small>';
  box.appendChild(el);
});
document.getElementById('ua').textContent = navigator.userAgent;
</script></body></html>
