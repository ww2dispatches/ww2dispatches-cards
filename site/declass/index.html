<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Declass</title>
<meta name="theme-color" content="#120F0C">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Special+Elite&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Build sessions 1 to 3: a bare page that proves sign in works, opens real envelopes, and lists the posted cards. The full game page replaces this in session 4. */
:root { --night:#120F0C; --paper:#EDE4CF; --sand:#C9B98F; --red:#B04A3E; --line:rgba(237,228,207,.18);
  --display:"Oswald","Arial Narrow",Impact,sans-serif; --type:"Special Elite","Courier New",monospace; --body:"Source Sans 3",system-ui,sans-serif; color-scheme:dark; }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--night); color:var(--paper); font-family:var(--body); min-height:100vh; }
main { max-width:460px; margin:0 auto; padding:56px 16px; text-align:center; }
h1 { font-family:var(--display); font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:44px; margin:0 0 4px; }
.sub { font-family:var(--type); color:var(--sand); margin:0 0 36px; }
.panel { border:1px solid var(--line); border-radius:6px; padding:28px 20px; background:rgba(255,255,255,.03); }
.file { font-family:var(--type); font-size:28px; letter-spacing:.12em; margin:8px 0 18px; }
dl { display:grid; grid-template-columns:auto auto; gap:6px 16px; justify-content:center; margin:0 0 22px; text-align:left; }
dt { color:var(--sand); } dd { margin:0; }
button { font:600 15px var(--body); color:var(--paper); background:transparent; border:1px solid var(--line); border-radius:4px; padding:10px 18px; cursor:pointer; }
button:hover { border-color:var(--sand); }
#gbtn { display:flex; justify-content:center; min-height:44px; }
.err { color:#E08A7E; margin-top:14px; min-height:1.2em; }
#catalog { margin-top:28px; text-align:left; }
#catalog h2 { font-family:var(--display); font-weight:600; letter-spacing:.06em; text-transform:uppercase; font-size:18px; margin:0 0 4px; }
#catalog .note { color:var(--sand); font-size:14px; margin:0 0 14px; }
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.grid button { padding:0; border:0; background:none; display:block; text-align:left; color:var(--paper); }
.grid img { width:100%; aspect-ratio:4/5; object-fit:cover; display:block; border-radius:3px; background:#2a241d; }
.grid span { display:block; font-size:12px; color:var(--sand); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#view { margin-top:18px; border:1px solid var(--line); border-radius:6px; padding:16px; background:rgba(255,255,255,.03); }
#view img { width:100%; border-radius:3px; display:block; }
#view .kicker { font-family:var(--type); color:var(--sand); font-size:13px; margin:12px 0 4px; }
#view h3 { font-family:var(--display); font-weight:600; font-size:22px; margin:0 0 8px; }
#view p { line-height:1.5; }
.files { margin:0 0 22px; display:grid; gap:8px; }
.files button { width:100%; text-align:left; display:flex; justify-content:space-between; gap:10px; }
.files button:disabled { opacity:.45; cursor:default; }
.files .prio { border-color:#A0743B; } .files .comm { border-color:#B8862B; background:#000; }
.files .next { color:var(--sand); font-size:14px; }
.pulled { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:6px 0 10px; }
.pulled img { width:100%; aspect-ratio:4/5; object-fit:cover; display:block; border-radius:3px; background:#2a241d; }
.pulled span { display:block; font-size:12px; margin-top:3px; }
.f-copper { color:#C8865A; } .f-silver { color:#D9DDE2; } .f-gold { color:#E7C35A; } .f-topsecret { color:#F08AD8; }
[hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Declass</h1>
  <p class="sub">a WW2 Dispatches game</p>

  <section class="panel" id="soon" hidden>
    <p class="file">Coming soon</p>
    <p>Follow <a href="https://ww2dispatches.com/">WW2 Dispatches</a> to hear when the files open.</p>
  </section>

  <section class="panel" id="signin" hidden>
    <p>Sign in to open your dossier.</p>
    <div id="gbtn"></div>
  </section>

  <section class="panel" id="who" hidden>
    <p>Signed in. Your file number</p>
    <p class="file" id="fileno"></p>
    <dl>
      <dt>Opened</dt><dd id="since"></dd>
      <dt>Cards</dt><dd id="cards"></dd>
      <dt>Streak</dt><dd id="streak"></dd>
      <dt>Tester</dt><dd id="tester"></dd>
    </dl>
    <div class="files" id="files"></div>
    <button id="signout">Sign out</button>
  </section>

  <section id="catalog" hidden>
    <h2>Posted so far</h2>
    <p class="note" id="catnote"></p>
    <div id="view" hidden></div>
    <div class="grid" id="grid"></div>
  </section>

  <p class="err" id="err"></p>
</main>
<script>
(function () {
  // The tester key arrives once as ?key=..., is remembered in this browser, then dropped from the address bar.
  var KEY_STORE = 'declass_key', key = '';
  try {
    var url = new URL(location.href), k = url.searchParams.get('key');
    if (k) { localStorage.setItem(KEY_STORE, k); url.searchParams.delete('key'); history.replaceState(null, '', url.pathname + url.search + url.hash); }
    key = localStorage.getItem(KEY_STORE) || '';
  } catch (e) { key = new URLSearchParams(location.search).get('key') || ''; }

  var $ = function (id) { return document.getElementById(id); };
  function show(id) { ['soon', 'signin', 'who'].forEach(function (s) { $(s).hidden = s !== id; }); }
  function api(path, body) {
    return fetch('/api/' + path, {
      method: body ? 'POST' : 'GET',
      headers: Object.assign({ 'x-declass-key': key }, body ? { 'content-type': 'application/json' } : {}),
      body: body ? JSON.stringify(body) : undefined,
      credentials: 'same-origin'
    }).then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || r.status); return d; }); });
  }
  var FIN = { copper: 'Copper', silver: 'Silver', gold: 'Gold', topsecret: 'Top Secret' };
  function localTime(at) { return new Date(at).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' }); }
  function slotName(e) {
    var h = Number(new Date(e.at).toLocaleString('en-US', { timeZone: 'America/New_York', hour: 'numeric', hourCycle: 'h23' }));
    return (h < 12 ? 'Morning file' : 'Evening file') + (e.deep ? ' (deep archive)' : '');
  }
  function cardTile(p) {
    var c = p.cardInfo || {};
    return '<div><img alt="" src="' + esc(c.img) + '"><span class="f-' + p.finish + '">' + FIN[p.finish] +
      (p.variant === 'living' ? ' Living' : '') + (p.serial ? ' · Serial ' + String(p.serial).padStart(4, '0') : '') +
      '</span><span>' + esc(c.short || p.card) + '</span></div>';
  }
  // Session 3 check: today's real envelopes, opened and turned on the server.
  function showState(d) {
    var p = d.player;
    $('fileno').textContent = p.fileNumber;
    $('since').textContent = new Date(p.since).toLocaleDateString();
    var tally = {}; d.pulls.forEach(function (x) { tally[x.finish] = (tally[x.finish] || 0) + 1; });
    $('cards').textContent = d.pulls.length + (d.pulls.length ? ' (' + Object.keys(FIN).filter(function (f) { return tally[f]; }).map(function (f) { return tally[f] + ' ' + FIN[f]; }).join(', ') + ')' : '');
    $('streak').textContent = p.streak + ' day' + (p.streak === 1 ? '' : 's') + ', next priority envelope in ' + p.nextPriorityIn;
    $('tester').textContent = p.tester ? 'Yes' : 'No';
    var locked = d.waiting.length > 0, h = '';
    if (locked) {
      h += '<p>' + d.waiting.length + ' cards waiting to be turned</p><div class="pulled">' + d.waiting.map(cardTile).join('') + '</div>' +
        '<button data-turn="1">Turn them over</button>';
    }
    d.commemorative.forEach(function (e) {
      h += '<button class="comm" data-slot="' + esc(e.key) + '"' + (e.opened || locked ? ' disabled' : '') + '><span>Commemorative file · ' + esc(e.name) + '</span><span>' + (e.opened ? 'Declassed' : 'until ' + localTime(e.closes)) + '</span></button>';
    });
    for (var i = 0; i < d.priority; i++) {
      h += '<button class="prio" data-slot="priority"' + (locked ? ' disabled' : '') + '><span>Priority envelope</span><span>Deep archive</span></button>';
    }
    d.envelopes.slice().reverse().forEach(function (e) {
      h += '<button data-slot="' + esc(e.key) + '"' + (e.opened || locked ? ' disabled' : '') + '><span>' + slotName(e) + '</span><span>' + (e.opened ? 'Declassed' : localTime(e.at)) + '</span></button>';
    });
    if (d.next) h += '<p class="next">Next file: ' + localTime(d.next) + '</p>';
    $('files').innerHTML = h;
    show('who');
  }
  function loadState() {
    return api('state').then(function (d) {
      if (d.player) showState(d);
      return d;
    });
  }
  $('files').onclick = function (e) {
    var b = e.target.closest('button'); if (!b || b.disabled) return;
    $('err').textContent = ''; b.disabled = true;
    var go = b.getAttribute('data-turn') ? api('turn', {}) : api('open', { slot: b.getAttribute('data-slot') });
    go.then(loadState).catch(function (err) { $('err').textContent = 'That did not work (' + err.message + ').'; loadState(); });
  };

  function startGoogle(clientId) {
    var s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = function () {
      google.accounts.id.initialize({
        client_id: clientId,
        callback: function (res) {
          $('err').textContent = '';
          api('auth/google', { credential: res.credential })
            .then(loadState)
            .catch(function (e) { $('err').textContent = 'Sign in did not work (' + e.message + ').'; });
        }
      });
      google.accounts.id.renderButton($('gbtn'), { theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with' });
    };
    document.head.appendChild(s);
  }

  $('signout').onclick = function () {
    try { google.accounts.id.disableAutoSelect(); } catch (e) {}
    api('auth/signout', {}).then(function () { location.reload(); });
  };

  // Session 2 check: the catalog the server serves, newest first. Only cards that have posted appear.
  function esc(t) { return String(t || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function openCard(id) {
    api('card?id=' + encodeURIComponent(id)).then(function (d) {
      var c = d.card, v = $('view');
      var kicker = (c.num ? 'No. ' + String(c.num).padStart(3, '0') + ' · ' : '') + c.seriesName + ' · ' + c.date + (c.place ? ' · ' + c.place : '');
      v.innerHTML = '<img alt="" src="' + esc(c.img) + '"><p class="kicker">' + esc(kicker) + '</p><h3>' + esc(c.title) + '</h3>' +
        (c.clue ? '<p class="kicker">The clue was: ' + esc(c.clue) + '</p>' : '') +
        '<p>' + esc((c.story || '').split('\n\n')[0]) + '</p>' +
        (c.film ? '<p class="kicker">Living Card: ' + esc(c.film.caption) + '</p>' : '') +
        '<p class="kicker">' + esc(c.photoCredit) + '</p>';
      v.hidden = false; v.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }).catch(function (e) { $('err').textContent = 'Could not open that card (' + e.message + ').'; });
  }
  function loadCatalog() {
    api('catalog').then(function (d) {
      var cards = d.cards.slice().reverse(), films = cards.filter(function (c) { return c.hasFilm; }).length;
      var nt = cards.filter(function (c) { return c.kind === 'namethis'; }).length;
      $('catnote').textContent = (cards.length - nt) + ' dispatch cards (' + films + ' with a Living Card) and ' + nt + ' Name This cards. Tap one.';
      $('grid').innerHTML = cards.map(function (c) {
        return '<button data-id="' + esc(c.id) + '"><img loading="lazy" alt="' + esc(c.short) + '" src="' + esc(c.img) + '"><span>' + esc(c.short) + '</span></button>';
      }).join('');
      $('grid').onclick = function (e) { var b = e.target.closest('button'); if (b) openCard(b.getAttribute('data-id')); };
      $('catalog').hidden = false;
    }).catch(function () {});
  }

  api('config').then(function (cfg) {
    if (!cfg.open) return show('soon');
    loadCatalog();
    return loadState().then(function (d) {
      if (!d.player) { show('signin'); startGoogle(cfg.googleClientId); }
    });
  }).catch(function (e) {
    show('soon');
    if (e.message === 'not configured') $('err').textContent = 'Server not set up yet.';
  });
})();
</script>
</body>
</html>
