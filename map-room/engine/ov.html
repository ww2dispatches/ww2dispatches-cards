<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Oswald";font-weight:500;src:url(../../renderer/fonts/oswald-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Oswald";font-weight:700;src:url(../../renderer/fonts/oswald-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Special Elite";font-weight:400;src:url(../../renderer/fonts/special-elite-latin-400-normal.woff2) format("woff2")}
html,body{margin:0;background:transparent}canvas{display:block}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas><script>
const PAPER="#EFE6D2", INK="#1F2A44", RED="#B04A3E";
const q=new URLSearchParams(location.search);
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeGrain(){const c=document.createElement("canvas");c.width=c.height=256;const g=c.getContext("2d");
  const d=g.createImageData(256,256),r=rng(7);
  for(let i=0;i<d.data.length;i+=4){d.data[i]=92;d.data[i+1]=71;d.data[i+2]=43;d.data[i+3]=Math.floor(r()*r()*55);}
  g.putImageData(d,0,0);return c;}
let grain;
function paper(ctx,x,y,w,h,s){
  ctx.save(); ctx.shadowColor="rgba(0,0,0,.5)"; ctx.shadowBlur=16*s; ctx.shadowOffsetY=4*s;
  ctx.fillStyle=PAPER; ctx.fillRect(x,y,w,h); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  ctx.fillStyle=ctx.createPattern(grain,"repeat"); ctx.fillRect(x,y,w,h); ctx.restore();}
async function go(){
  await Promise.all(["700 10px Oswald","500 10px Oswald",'400 10px "Special Elite"'].map(f=>document.fonts.load(f)));
  grain=makeGrain();
  const cv=document.getElementById("c"),ctx=cv.getContext("2d"),W=1080,H=1920,s=1;
  if(q.get("photo")){const img=await new Promise(ok=>{const i=new Image();i.onload=()=>ok(i);i.src=q.get("photo");});
    ctx.fillStyle="#1b1b1b";ctx.fillRect(0,0,W,H);
    const k=Math.max(W/img.naturalWidth,H/img.naturalHeight),dw=img.naturalWidth*k,dh=img.naturalHeight*k,fx=+(q.get("fx")||50),fy=+(q.get("fy")||40);
    ctx.drawImage(img,-(dw-W)*fx/100,-(dh-H)*fy/100,dw,dh);}
  ctx.textBaseline="alphabetic"; ctx.textAlign="left";
  if(q.get("tab")!=="0"){
  const name=q.get("name"), day=q.get("day"), CAP=q.get("cap");
  ctx.font=`700 ${44*s}px Oswald`; ctx.letterSpacing=`${2*s}px`;
  const nameW=ctx.measureText(name).width, dayW=ctx.measureText(day).width;
  ctx.font=`500 ${20*s}px Oswald`; ctx.letterSpacing=`${5*s}px`; const capW=ctx.measureText(CAP).width;
  const tabW=Math.max(capW,nameW+18*s+dayW)+48*s, tabH=(16+20+6+44+16)*s+4*s, tx=40*s, ty=+(q.get("ty")||110);
  paper(ctx,tx,ty,tabW,tabH,s); ctx.fillStyle=INK; ctx.fillText(CAP,tx+24*s,ty+(14+18)*s);
  ctx.font=`700 ${44*s}px Oswald`; ctx.letterSpacing=`${2*s}px`; const by=ty+(14+20+6+40)*s;
  ctx.fillText(name,tx+24*s,by); ctx.fillStyle=RED; ctx.fillText(day,tx+24*s+nameW+18*s,by);}
  if(q.get("sub")){
  const lift=+(q.get("lift")||330), padX=40*s, innerW=W-2*padX; let fs=50*s; ctx.letterSpacing="0px";
  const sub=q.get("sub");
  for(;fs>40*s;fs-=1*s){ctx.font=`700 ${fs}px Oswald`; if(ctx.measureText(sub).width<=innerW) break;}
  ctx.font=`700 ${fs}px Oswald`;
  const stripH=(24+fs/s*1.05+12+26+22)*s, sy=H-lift-stripH;
  paper(ctx,0,sy,W,stripH,s); ctx.fillStyle=INK; ctx.fillText(sub,padX,sy+24*s+fs*.86);
  const ly=sy+stripH-22*s-4*s; ctx.font=`400 ${26*s}px "Special Elite"`; ctx.fillText(q.get("bl"),padX,ly);
  ctx.font=`400 ${22*s}px "Special Elite"`; ctx.textAlign="right"; ctx.fillText("@ww2dispatches",W-padX,ly); ctx.textAlign="left";}
  if(q.get("stamp")){ctx.font=`500 22px Oswald`; ctx.letterSpacing="3px"; ctx.fillStyle="rgba(176,74,62,.9)"; ctx.textAlign="right"; ctx.fillText(q.get("stamp"),W-40,60);}
  document.title="done";
}
go();
</script></body></html>
